<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpinLux – Roue de la Chance Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#F0D98C;--gold-dark:#8A6914;
  --violet:#7C3AED;--violet-light:#A78BFA;--neon:#00F5C4;
  --bg-deep:#08080F;--bg-1:#0E0E1A;--bg-2:#141424;--bg-3:#1C1C32;--bg-4:#22223A;
  --border:rgba(201,168,76,0.18);--border-hover:rgba(201,168,76,0.42);
  --text-1:#F8F6FF;--text-2:#C4BFDE;--text-3:#7A739A;
  --shadow-gold:0 0 32px rgba(201,168,76,0.22),0 0 80px rgba(201,168,76,0.08);
  --radius:14px;--radius-sm:8px;--radius-lg:20px;
  --font-body:'Outfit',sans-serif;--font-display:'Playfair Display',serif;
  --tr:0.22s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;overflow-x:hidden}
body{min-height:100vh;background:var(--bg-deep);color:var(--text-1);font-family:var(--font-body);font-size:15px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 0%,rgba(124,58,237,0.12) 0%,transparent 70%),radial-gradient(ellipse 50% 35% at 80% 100%,rgba(201,168,76,0.09) 0%,transparent 65%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.layout{display:grid;grid-template-columns:300px 1fr 300px;min-height:calc(100vh - 60px)}
@media(max-width:900px){.layout{grid-template-columns:260px 1fr}.panel-r{display:none}}
@media(max-width:600px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.panel-l{order:2}.wheel-center{order:1}}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:rgba(8,8,15,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--font-display);font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
.tagline{font-size:10px;color:var(--text-3);font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.hdr-actions{display:flex;align-items:center;gap:8px}
.lang-sel{display:flex;gap:3px;padding:3px;background:var(--bg-2);border:1px solid var(--border);border-radius:40px}
.lang-btn{background:none;border:none;cursor:pointer;font-size:16px;width:30px;height:26px;border-radius:40px;display:flex;align-items:center;justify-content:center;transition:var(--tr);opacity:.45;filter:grayscale(.5)}
.lang-btn:hover{opacity:.8;filter:none}
.lang-btn.active{opacity:1;filter:none;background:var(--bg-4);box-shadow:0 0 0 1px var(--gold)}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--bg-2);border-radius:var(--radius-sm);color:var(--text-3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.icon-btn:hover{background:var(--bg-3);border-color:var(--border-hover);color:var(--gold)}
.icon-btn.active{color:var(--gold);border-color:var(--gold)}

/* PANELS */
.panel{background:rgba(14,14,26,.7);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(10px)}
.panel-r{border-right:none;border-left:1px solid var(--border)}
.ptitle{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--border)}
.psec{display:flex;flex-direction:column;gap:9px}
.inp-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.sl-input{width:100%;padding:8px 11px;background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-1);font-family:var(--font-body);font-size:13.5px;outline:none;transition:var(--tr)}
.sl-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.sl-input::placeholder{color:var(--text-3)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;font-family:var(--font-body);font-size:12.5px;font-weight:600;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);white-space:nowrap;letter-spacing:.03em}
.btn-p{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--bg-deep)}
.btn-p:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-s{background:var(--bg-3);color:var(--text-2);border:1px solid var(--border)}
.btn-s:hover{background:var(--bg-4);border-color:var(--border-hover);color:var(--text-1)}
.btn-ghost{background:transparent;color:var(--text-3);padding:5px 9px;font-size:11.5px;font-family:var(--font-body);border:none;cursor:pointer;transition:var(--tr)}
.btn-ghost:hover{color:var(--gold)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.w-full{width:100%}
.divider{height:1px;background:var(--border);width:100%}
.flex-1{flex:1}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}

/* WHEEL CENTER */
.wheel-center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px;gap:18px;position:relative}
.wheel-wrap{position:relative;width:100%;max-width:480px;display:flex;align-items:center;justify-content:center}
#wheel-canvas{cursor:pointer;border-radius:50%;display:block;margin:0 auto;transition:filter .3s}
#wheel-canvas:hover{filter:brightness(1.05)}
.pin-wrap{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:10;filter:drop-shadow(0 4px 12px rgba(201,168,76,.7));animation:pin-pulse 2.5s ease-in-out infinite}
@keyframes pin-pulse{0%,100%{filter:drop-shadow(0 4px 12px rgba(201,168,76,.5))}50%{filter:drop-shadow(0 4px 22px rgba(201,168,76,.9))}}
#pin-canvas{display:block}

/* SPIN BUTTON */
#spin-btn{position:relative;padding:15px 48px;font-family:var(--font-body);font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--bg-deep);background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 50%,var(--gold-dark) 100%);border:none;border-radius:60px;cursor:pointer;overflow:hidden;transition:var(--tr);box-shadow:0 0 0 1px rgba(201,168,76,.4),0 4px 24px rgba(201,168,76,.35),0 12px 40px rgba(201,168,76,.15),inset 0 1px 0 rgba(255,255,255,.4)}
#spin-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 60%);border-radius:inherit}
#spin-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 1px rgba(201,168,76,.6),0 8px 32px rgba(201,168,76,.5),0 20px 60px rgba(201,168,76,.2),inset 0 1px 0 rgba(255,255,255,.4)}
#spin-btn:active:not(:disabled){transform:translateY(0) scale(.98)}
#spin-btn.spinning{background:linear-gradient(135deg,#5a3fa0,var(--violet));color:#fff;cursor:not-allowed;animation:spin-pulse 1.2s ease-in-out infinite}
@keyframes spin-pulse{0%,100%{box-shadow:0 0 0 1px rgba(124,58,237,.5),0 4px 24px rgba(124,58,237,.4)}50%{box-shadow:0 0 0 2px rgba(124,58,237,.8),0 4px 40px rgba(124,58,237,.6)}}

/* SECTIONS LIST */
#sections-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;padding-right:2px}
#sections-list::-webkit-scrollbar{width:3px}
#sections-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.section-item{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);transition:var(--tr);cursor:default}
.section-item:hover{border-color:var(--border-hover);background:var(--bg-3)}
.section-item.dragging{opacity:.4;border:2px dashed var(--gold)}
.drag-handle{color:var(--text-3);font-size:13px;cursor:grab;flex-shrink:0;line-height:1}
.sec-color{width:26px;height:26px;border:none;border-radius:5px;padding:0;cursor:pointer;background:none;flex-shrink:0}
.sec-color::-webkit-color-swatch-wrapper{padding:0}
.sec-color::-webkit-color-swatch{border:none;border-radius:4px}
.sec-text{flex:1;min-width:0;background:none;border:none;color:var(--text-1);font-family:var(--font-body);font-size:13px;outline:none}
.sec-text::placeholder{color:var(--text-3)}
.sec-weight{width:42px;background:var(--bg-3);border:1px solid var(--border);border-radius:4px;color:var(--text-2);font-size:12px;text-align:center;padding:2px 4px;outline:none}
.sec-weight:focus{border-color:var(--gold)}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--tr);flex-shrink:0}
.btn-icon:hover{color:#f87171;background:rgba(239,68,68,.12)}

/* TEMPLATES */
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tpl-btn{padding:7px 9px;font-size:12px;font-weight:500;background:var(--bg-3);color:var(--text-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr);text-align:left;font-family:var(--font-body)}
.tpl-btn:hover{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--gold-light)}

/* WHEELS LIST */
#wheels-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
.wheel-item{display:flex;align-items:center;gap:7px;padding:8px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--tr)}
.wheel-item:hover{background:var(--bg-3);border-color:var(--border-hover)}
.wheel-item.active{background:rgba(201,168,76,.1);border-color:var(--gold)}
.wi-name{flex:1;font-size:12.5px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi-count{font-size:11px;color:var(--text-3);white-space:nowrap}

/* HISTORY */
#history-list{display:flex;flex-direction:column;gap:4px}
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.hist-dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--gold));flex-shrink:0;box-shadow:0 0 5px var(--accent,var(--gold))}
.hist-text{flex:1;font-size:12.5px;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-time{font-size:11px;color:var(--text-3);white-space:nowrap}
.hist-empty{font-size:13px;color:var(--text-3);text-align:center;padding:14px}

/* TOGGLE PILL */
.toggle-pill{display:flex;align-items:center;gap:6px;padding:6px 11px;background:var(--bg-3);border:1px solid var(--border);border-radius:40px;font-size:11.5px;font-weight:600;color:var(--text-3);cursor:pointer;transition:var(--tr);font-family:var(--font-body)}
.toggle-pill:hover{border-color:var(--border-hover);color:var(--text-2)}
.toggle-pill.active{background:rgba(201,168,76,.12);border-color:var(--gold);color:var(--gold)}

/* RESULT MODAL */
#result-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .35s}
#result-modal.open{opacity:1;pointer-events:all}
.result-bd{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px)}
.result-card{position:relative;background:var(--bg-2);border:1px solid var(--gold);border-radius:var(--radius-lg);padding:40px 48px;text-align:center;min-width:300px;max-width:440px;box-shadow:0 0 0 1px rgba(201,168,76,.2),var(--shadow-gold),0 40px 80px rgba(0,0,0,.6);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#result-modal.open .result-card{transform:scale(1)}
.result-crown{font-size:44px;animation:crown-bounce .6s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes crown-bounce{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#result-label{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:8px 0 5px}
.gold-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5;margin:4px 0}
#result-text{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:6px 0 26px;word-break:break-word}
.result-actions{display:flex;gap:9px;justify-content:center}
#result-close{padding:9px 22px;background:var(--bg-3);color:var(--text-2);border:1px solid var(--border);border-radius:40px;font-family:var(--font-body);font-size:13.5px;font-weight:600;cursor:pointer;transition:var(--tr)}
#result-close:hover{border-color:var(--border-hover);color:var(--text-1)}
#result-again{padding:9px 22px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--bg-deep);border:none;border-radius:40px;font-family:var(--font-body);font-size:13.5px;font-weight:700;cursor:pointer;transition:var(--tr)}
#result-again:hover{filter:brightness(1.15);transform:translateY(-1px)}

/* CONFETTI */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:300;display:none}

/* TOAST */
.sl-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-3);border:1px solid var(--border);color:var(--text-1);padding:9px 20px;border-radius:40px;font-size:13.5px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:500;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none}
.sl-toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.sl-toast.success{border-color:var(--gold)}
.sl-toast.error{border-color:#ef4444;color:#fca5a5}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app">

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <span class="logo">SpinLux</span>
    <span class="tagline" id="h-tagline">Roue de la Chance Premium</span>
  </div>
  <div class="hdr-actions">
    <button id="sound-btn" class="icon-btn active" title="Son">🔊</button>
    <button id="fullscreen-btn" class="icon-btn" title="Plein écran">⛶</button>
    <div class="lang-sel">
      <button class="lang-btn active" data-lang="fr">🇫🇷</button>
      <button class="lang-btn" data-lang="es">🇪🇸</button>
      <button class="lang-btn" data-lang="en">🇬🇧</button>
    </div>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- LEFT PANEL -->
  <aside class="panel panel-l">
    <div class="psec">
      <p class="ptitle" id="t-myWheels">Mes Roues</p>
      <div id="wheels-list"></div>
      <button id="new-wheel-btn" class="btn btn-s w-full" style="margin-top:4px" id="t-newWheel">+ Nouvelle Roue</button>
    </div>
    <div class="divider"></div>
    <div class="psec">
      <div class="flex items-center justify-between gap-2">
        <label class="inp-label" id="t-wheelName">Nom</label>
      </div>
      <input id="wheel-name" type="text" class="sl-input" placeholder="Ma Roue">
    </div>
    <div class="divider"></div>
    <div class="psec">
      <p class="ptitle" id="t-templates">Modèles rapides</p>
      <div class="tpl-grid">
        <button class="tpl-btn" data-template="yesno">✅ Oui/Non</button>
        <button class="tpl-btn" data-template="1to10">🔢 1 à 10</button>
        <button class="tpl-btn" data-template="colors">🎨 Couleurs</button>
        <button class="tpl-btn" data-template="days">📅 Jours</button>
        <button class="tpl-btn" data-template="months">🗓 Mois</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="psec">
      <div class="btn-row">
        <button id="save-btn" class="btn btn-p flex-1" id="t-save">💾 Sauvegarder</button>
        <button id="share-btn" class="btn btn-s" title="Partager">🔗</button>
      </div>
      <div class="btn-row">
        <button id="export-btn" class="btn btn-s flex-1">⬇ JSON</button>
        <button id="import-btn" class="btn btn-s flex-1">⬆ Import</button>
      </div>
    </div>
  </aside>

  <!-- WHEEL CENTER -->
  <main class="wheel-center">
    <div class="wheel-wrap">
      <div class="pin-wrap">
        <canvas id="pin-canvas"></canvas>
      </div>
      <canvas id="wheel-canvas"></canvas>
    </div>
    <button id="spin-btn">LANCER LA ROUE</button>
  </main>

  <!-- RIGHT PANEL -->
  <aside class="panel panel-r">
    <div class="psec">
      <div class="flex items-center justify-between gap-2">
        <p class="ptitle" id="t-sections">Sections</p>
        <button id="weights-toggle" class="toggle-pill">⚖ Poids</button>
      </div>
      <div id="sections-list"></div>
      <button id="add-section-btn" class="btn btn-s w-full" style="margin-top:4px">+ Ajouter une section</button>
    </div>
    <div class="divider"></div>
    <div class="psec">
      <div class="flex items-center justify-between gap-2">
        <p class="ptitle" id="t-history">Historique</p>
        <button id="clear-history-btn" class="btn-ghost">Effacer</button>
      </div>
      <div id="history-list"></div>
    </div>
  </aside>

</div>
</div><!-- /app -->

<!-- RESULT MODAL -->
<div id="result-modal">
  <div class="result-bd"></div>
  <div class="result-card">
    <div class="result-crown">👑</div>
    <p id="result-label">Gagnant !</p>
    <div class="gold-line"></div>
    <p id="result-text"></p>
    <div class="result-actions">
      <button id="result-close">Fermer</button>
      <button id="result-again">🔄 Relancer</button>
    </div>
  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
// ═══════════════════════════════════════════════════════
// SpinLux – All-in-one script
// ═══════════════════════════════════════════════════════

// ── i18n ─────────────────────────────────────────────
const TR = {
  fr:{tagline:"Roue de la Chance Premium",spinBtn:"LANCER LA ROUE",winner:"Gagnant !",spinning:"La chance tourne…",historyEmpty:"Aucun lancer encore",myWheels:"Mes Roues",newWheel:"+ Nouvelle Roue",wheelName:"Nom",templates:"Modèles rapides",sections:"Sections",history:"Historique",addSection:"+ Ajouter une section",save:"💾 Sauvegarder",share:"🔗",noSections:"Ajoutez au moins 2 sections",saved:"Sauvegardé !",linkCopied:"Lien copié !",close:"Fermer",spinAgain:"🔄 Relancer",untitled:"Ma Roue",drag:"Glissez pour réorganiser",weights:"⚖ Poids"},
  es:{tagline:"Ruleta de la Suerte Premium",spinBtn:"GIRAR LA RULETA",winner:"¡Ganador!",spinning:"La suerte gira…",historyEmpty:"Sin lanzamientos",myWheels:"Mis Ruletas",newWheel:"+ Nueva Ruleta",wheelName:"Nombre",templates:"Plantillas",sections:"Secciones",history:"Historial",addSection:"+ Añadir sección",save:"💾 Guardar",share:"🔗",noSections:"Añade al menos 2 secciones",saved:"¡Guardado!",linkCopied:"¡Enlace copiado!",close:"Cerrar",spinAgain:"🔄 Girar de nuevo",untitled:"Mi Ruleta",drag:"Arrastra para reorganizar",weights:"⚖ Pesos"},
  en:{tagline:"Premium Luck Wheel",spinBtn:"SPIN THE WHEEL",winner:"Winner!",spinning:"Luck is spinning…",historyEmpty:"No spins yet",myWheels:"My Wheels",newWheel:"+ New Wheel",wheelName:"Name",templates:"Quick Templates",sections:"Sections",history:"History",addSection:"+ Add section",save:"💾 Save",share:"🔗",noSections:"Add at least 2 sections",saved:"Saved!",linkCopied:"Link copied!",close:"Close",spinAgain:"🔄 Spin again",untitled:"My Wheel",drag:"Drag to reorder",weights:"⚖ Weights"},
};
let lang = localStorage.getItem('sl_lang')||'fr';
const t = k => (TR[lang]||TR.en)[k]||k;
function setLang(l){lang=l;localStorage.setItem('sl_lang',l);document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));applyI18n()}
function applyI18n(){
  const $ = id => document.getElementById(id);
  if($('h-tagline')) $('h-tagline').textContent = t('tagline');
  if($('spin-btn') && !spinEngine.spinning) $('spin-btn').textContent = t('spinBtn');
  if($('t-myWheels')) $('t-myWheels').textContent = t('myWheels');
  if($('t-templates')) $('t-templates').textContent = t('templates');
  if($('t-sections')) $('t-sections').textContent = t('sections');
  if($('t-history')) $('t-history').textContent = t('history');
  if($('t-wheelName')) $('t-wheelName').textContent = t('wheelName');
  document.getElementById('add-section-btn').textContent = t('addSection');
  document.getElementById('save-btn').textContent = t('save');
  document.getElementById('weights-toggle').textContent = t('weights');
  document.getElementById('new-wheel-btn').textContent = t('newWheel');
  document.getElementById('result-close').textContent = t('close');
  document.getElementById('result-again').textContent = t('spinAgain');
  renderHistory();
}

// ── Utils ─────────────────────────────────────────────
const PALETTE = ["#C9A84C","#8B5CF6","#EC4899","#10B981","#F59E0B","#3B82F6","#EF4444","#14B8A6","#F97316","#6366F1","#84CC16","#E11D48","#0EA5E9","#D946EF","#22C55E","#FB923C"];
function getColor(i){return PALETTE[i%PALETTE.length]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function getTextColor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1a1a2e':'#ffffff'}
function lighten(hex,a=.18){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`#${Math.min(255,Math.round(r+(255-r)*a)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(g+(255-g)*a)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(b+(255-b)*a)).toString(16).padStart(2,'0')}`}
function easeOutQuart(t){return 1-Math.pow(1-t,4)}
function pickWeighted(weights){const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return i}return weights.length-1}
function trunc(s,n=22){return s.length>n?s.slice(0,n-1)+'…':s}
function ftime(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function toast(msg,type='success',dur=2200){
  let el=document.getElementById('sl-toast');
  if(el)el.remove();
  el=document.createElement('div');el.id='sl-toast';
  el.className=`sl-toast ${type}`;el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('visible'));
  setTimeout(()=>{el.classList.remove('visible');setTimeout(()=>el.remove(),400)},dur);
}

// ── Templates ─────────────────────────────────────────
const TPLS = {
  yesno:{name:"Oui / Non",sections:[{text:"✅ OUI",color:"#10B981",weight:1},{text:"❌ NON",color:"#EF4444",weight:1}]},
  "1to10":{name:"1 à 10",sections:Array.from({length:10},(_,i)=>({text:String(i+1),color:getColor(i),weight:1}))},
  colors:{name:"Couleurs",sections:[{text:"🔴 Rouge",color:"#EF4444",weight:1},{text:"🟠 Orange",color:"#F97316",weight:1},{text:"🟡 Jaune",color:"#F59E0B",weight:1},{text:"🟢 Vert",color:"#10B981",weight:1},{text:"🔵 Bleu",color:"#3B82F6",weight:1},{text:"🟣 Violet",color:"#8B5CF6",weight:1},{text:"🩷 Rose",color:"#EC4899",weight:1}]},
  days:{name:"Jours",sections:["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"].map((d,i)=>({text:d,color:getColor(i),weight:1}))},
  months:{name:"Mois",sections:["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"].map((m,i)=>({text:m,color:getColor(i),weight:1}))},
};

// ── State ─────────────────────────────────────────────
let state={wheels:[],activeId:null,history:[],soundOn:true,showWeights:false};
function save(){try{localStorage.setItem('sl_state',JSON.stringify(state))}catch{}}
function load(){try{const r=localStorage.getItem('sl_state');if(r){const s=JSON.parse(r);Object.assign(state,s)}}catch{}}
function getActive(){return state.wheels.find(w=>w.id===state.activeId)||null}
function newWheel(name,sections){
  const w={id:uid(),name:name||t('untitled'),sections:sections||[0,1,2,3].map(i=>({id:uid(),text:`Section ${i+1}`,color:getColor(i),weight:1}))};
  state.wheels.push(w);state.activeId=w.id;save();return w;
}

// ── Audio ─────────────────────────────────────────────
let ac=null;
function getAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac}
function playTick(){if(!state.soundOn)return;try{const c=getAC(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=1100;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.055);o.start();o.stop(c.currentTime+.055)}catch{}}
function playWin(){if(!state.soundOn)return;try{const c=getAC();[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=f;const t0=c.currentTime+i*.12;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.16,t0+.04);g.gain.exponentialRampToValueAtTime(.001,t0+.38);o.start(t0);o.stop(t0+.4)})}catch{}}
let tickTO=null;
function startTick(){let d=75;function s(){tickTO=setTimeout(()=>{playTick();d=Math.min(d*1.05,450);if(d<500)s();else tickTO=null},d)}s()}

// ── Wheel Engine ──────────────────────────────────────
const spinEngine={
  canvas:null,ctx:null,sections:[],rotation:0,spinning:false,
  _dpr:1,_dim:0,_startA:0,_targetA:0,_dur:0,_t0:null,
  rimColor:'#C9A84C',rimW:13,glowColor:'rgba(201,168,76,.45)',

  init(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this._dpr=Math.min(window.devicePixelRatio||1,2);
    this._resize();
    canvas.addEventListener('click',()=>{if(!this.spinning)this.go()});
    window.addEventListener('resize',()=>this._resize());
  },
  _resize(){
    const size=this.canvas.parentElement?.clientWidth||460;
    const dim=Math.min(size,500);
    this.canvas.style.width=dim+'px';this.canvas.style.height=dim+'px';
    this.canvas.width=dim*this._dpr;this.canvas.height=dim*this._dpr;
    this._dim=dim;
    this.ctx.setTransform(1,0,0,1,0,0);
    this.ctx.scale(this._dpr,this._dpr);
    this.draw();
  },
  setSections(s){this.sections=s;this.draw()},
  draw(){
    const ctx=this.ctx,dim=this._dim,cx=dim/2,cy=dim/2,r=dim/2-this.rimW-3;
    ctx.clearRect(0,0,dim,dim);
    if(!this.sections||this.sections.length<2){this._drawEmpty(ctx,cx,cy,r);return}
    const total=this.sections.reduce((s,x)=>s+(x.weight||1),0);
    let sa=this.rotation-Math.PI/2;
    this.sections.forEach(sec=>{
      const slice=((sec.weight||1)/total)*Math.PI*2,ea=sa+slice,ma=sa+slice/2,c=sec.color||'#555';
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();
      const g=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r);
      g.addColorStop(0,lighten(c,.18));g.addColorStop(1,c);
      ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();
      ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.stroke();
      // shimmer
      const sg=ctx.createLinearGradient(cx+Math.cos(ma)*r*.3,cy+Math.sin(ma)*r*.3,cx+Math.cos(ma)*r*.9,cy+Math.sin(ma)*r*.9);
      sg.addColorStop(0,'rgba(255,255,255,.12)');sg.addColorStop(.5,'rgba(255,255,255,.04)');sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fillStyle=sg;ctx.fill();
      // text
      ctx.save();ctx.translate(cx,cy);ctx.rotate(ma);
      const tx=r*.62,fs=Math.max(10,Math.min(17,(r*.42)/Math.max(1,sec.text.length*.5)));
      ctx.font=`600 ${fs}px 'Outfit',sans-serif`;ctx.fillStyle=getTextColor(c);ctx.textAlign='right';ctx.textBaseline='middle';
      ctx.shadowBlur=3;ctx.shadowColor='rgba(0,0,0,.5)';
      let lbl=sec.text||'';const mw=r*.72;
      while(ctx.measureText(lbl).width>mw&&lbl.length>2)lbl=lbl.slice(0,-1);
      if(lbl!==sec.text)lbl=lbl.slice(0,-1)+'…';
      ctx.fillText(lbl,tx,0);ctx.restore();
      sa=ea;
    });
    // rim
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=this.rimColor;ctx.lineWidth=this.rimW;ctx.shadowBlur=20;ctx.shadowColor=this.glowColor;ctx.stroke();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(cx,cy,r+this.rimW/2,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,r-this.rimW/2,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.stroke();
    // hub
    const hr=r*.08,hg=ctx.createRadialGradient(cx-hr*.2,cy-hr*.2,1,cx,cy,hr);
    hg.addColorStop(0,'#fff9e6');hg.addColorStop(.5,this.rimColor);hg.addColorStop(1,'#8a6914');
    ctx.beginPath();ctx.arc(cx,cy,hr,0,Math.PI*2);ctx.fillStyle=hg;ctx.shadowBlur=10;ctx.shadowColor='rgba(201,168,76,.6)';ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(cx,cy,hr,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();
  },
  _drawEmpty(ctx,cx,cy,r){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=this.rimColor;ctx.lineWidth=this.rimW;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='rgba(201,168,76,.06)';ctx.fill();
    ctx.font="500 16px 'Outfit',sans-serif";ctx.fillStyle='rgba(201,168,76,.5)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Ajoutez des sections',cx,cy);
  },
  go(){
    if(this.spinning||!this.sections||this.sections.length<2)return;
    const weights=this.sections.map(s=>s.weight||1);
    const idx=pickWeighted(weights);
    this.spinTo(idx);
  },
  spinTo(idx){
    if(this.spinning)return;
    const total=this.sections.reduce((s,x)=>s+(x.weight||1),0);
    let cum=0,mid=0;
    for(let i=0;i<=idx;i++){const sl=((this.sections[i].weight||1)/total)*Math.PI*2;if(i===idx)mid=cum+sl/2;cum+=sl}
    const target=-Math.PI/2-mid;
    const extra=(5+Math.floor(Math.random()*5))*Math.PI*2;
    const raw=target-this.rotation+(Math.random()*.04-.02);
    const norm=raw-Math.floor(raw/(Math.PI*2))*Math.PI*2;
    this._startA=this.rotation;this._targetA=this.rotation+norm+extra;
    this._dur=4200+Math.random()*1600;this._t0=null;this.spinning=true;
    document.getElementById('spin-btn').classList.add('spinning');
    document.getElementById('spin-btn').textContent=t('spinning');
    startTick();
    requestAnimationFrame(ts=>this._frame(ts));
  },
  _frame(ts){
    if(!this._t0)this._t0=ts;
    const prog=Math.min((ts-this._t0)/this._dur,1),e=easeOutQuart(prog);
    this.rotation=this._startA+(this._targetA-this._startA)*e;
    this.draw();
    if(prog<1){requestAnimationFrame(ts=>this._frame(ts))}
    else{
      this.rotation=this._targetA;this.spinning=false;this.draw();
      const nr=((this.rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const pa=(Math.PI*1.5-nr+Math.PI*2)%(Math.PI*2);
      const total=this.sections.reduce((s,x)=>s+(x.weight||1),0);
      let ca=0;
      for(let i=0;i<this.sections.length;i++){
        const sl=((this.sections[i].weight||1)/total)*Math.PI*2;
        if(pa>=ca&&pa<ca+sl){showResult(this.sections[i]);break}
        ca+=sl;
      }
      document.getElementById('spin-btn').classList.remove('spinning');
      document.getElementById('spin-btn').textContent=t('spinBtn');
    }
  },
};

// ── Pin ────────────────────────────────────────────────
function drawPin(){
  const c=document.getElementById('pin-canvas');
  if(!c)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=38*dpr;c.height=50*dpr;c.style.width='38px';c.style.height='50px';
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  ctx.beginPath();ctx.moveTo(19,46);ctx.lineTo(3,7);ctx.lineTo(11,13);ctx.lineTo(19,3);ctx.lineTo(27,13);ctx.lineTo(35,7);ctx.closePath();
  const g=ctx.createLinearGradient(3,3,35,46);g.addColorStop(0,'#fff9e6');g.addColorStop(.4,'#C9A84C');g.addColorStop(1,'#8a6914');
  ctx.fillStyle=g;ctx.shadowBlur=12;ctx.shadowColor='rgba(201,168,76,.7)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.stroke();
}

// ── Confetti ───────────────────────────────────────────
function launchConfetti(color){
  const cv=document.getElementById('confetti-canvas');if(!cv)return;
  cv.style.display='block';const ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const pts=Array.from({length:110},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height*.4-cv.height*.2,
    vx:(Math.random()-.5)*8,vy:Math.random()*6+2,
    rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,
    w:Math.random()*10+5,h:Math.random()*5+3,
    c:[color,'#C9A84C','#fff','#8B5CF6','#EC4899'][Math.floor(Math.random()*5)],a:1
  }));
  let raf;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);let alive=false;
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=.12;p.a=Math.max(0,p.a-.008);if(p.a>0)alive=true;
      ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(alive)raf=requestAnimationFrame(loop);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display='none'}
  }
  raf=requestAnimationFrame(loop);
}

// ── Result ─────────────────────────────────────────────
function showResult(sec){
  const m=document.getElementById('result-modal');
  document.getElementById('result-label').textContent=t('winner');
  document.getElementById('result-text').textContent=sec.text;
  document.getElementById('result-text').style.color=sec.color;
  m.classList.add('open');
  playWin();launchConfetti(sec.color);
  state.history.unshift({text:sec.text,color:sec.color,ts:Date.now()});
  state.history=state.history.slice(0,10);save();renderHistory();
}
function closeModal(){document.getElementById('result-modal').classList.remove('open')}

// ── Render ─────────────────────────────────────────────
function renderSections(){
  const w=getActive(),l=document.getElementById('sections-list');
  if(!l||!w)return;l.innerHTML='';
  w.sections.forEach((sec,i)=>{
    const el=document.createElement('div');el.className='section-item';el.setAttribute('draggable','true');el.dataset.id=sec.id;
    el.innerHTML=`<span class="drag-handle" title="${t('drag')}">⠿</span>
    <input type="color" class="sec-color" value="${sec.color}">
    <input type="text" class="sec-text" value="${sec.text}" placeholder="Section..." maxlength="40">
    ${state.showWeights?`<input type="number" class="sec-weight" value="${sec.weight||1}" min="1" max="100">`:''}
    <button class="btn-icon" data-i="${i}">✕</button>`;
    l.appendChild(el);
    el.querySelector('.sec-color').addEventListener('input',e=>{sec.color=e.target.value;syncWheel()});
    el.querySelector('.sec-text').addEventListener('input',e=>{sec.text=e.target.value;syncWheel()});
    if(state.showWeights)el.querySelector('.sec-weight').addEventListener('input',e=>{sec.weight=Math.max(1,parseInt(e.target.value)||1);syncWheel()});
    el.querySelector('.btn-icon').addEventListener('click',()=>{
      if(w.sections.length<=2)return toast(t('noSections'),'error');
      w.sections.splice(i,1);save();renderSections();syncWheel();
    });
  });
  // Drag-sort
  let drag=null;
  l.addEventListener('dragstart',e=>{drag=e.target.closest('[draggable]');if(drag)drag.classList.add('dragging')});
  l.addEventListener('dragover',e=>{e.preventDefault();const it=e.target.closest('[draggable]');if(!it||it===drag)return;const mid=it.getBoundingClientRect().top+it.getBoundingClientRect().height/2;l.insertBefore(drag,e.clientY<mid?it:it.nextSibling)});
  l.addEventListener('dragend',()=>{if(drag){drag.classList.remove('dragging');drag=null}
    const ids=[...l.querySelectorAll('[data-id]')].map(el=>el.dataset.id);
    w.sections=ids.map(id=>w.sections.find(s=>s.id===id)).filter(Boolean);save();syncWheel();
  });
}
function renderWheels(){
  const l=document.getElementById('wheels-list');if(!l)return;l.innerHTML='';
  state.wheels.forEach(w=>{
    const el=document.createElement('div');el.className='wheel-item'+(w.id===state.activeId?' active':'');
    el.innerHTML=`<span class="wi-name">${trunc(w.name,18)}</span><span class="wi-count">${w.sections.length}s</span><button class="btn-icon" data-del="${w.id}">✕</button>`;
    el.addEventListener('click',e=>{if(e.target.dataset.del)return;state.activeId=w.id;save();renderAll()});
    el.querySelector('[data-del]').addEventListener('click',()=>{
      if(state.wheels.length<=1)return toast('Dernière roue','error');
      if(!confirm('Supprimer cette roue ?'))return;
      state.wheels=state.wheels.filter(x=>x.id!==w.id);
      if(state.activeId===w.id)state.activeId=state.wheels[0]?.id;
      save();renderAll();
    });
    l.appendChild(el);
  });
}
function renderHistory(){
  const l=document.getElementById('history-list');if(!l)return;
  if(!state.history.length){l.innerHTML=`<p class="hist-empty">${t('historyEmpty')}</p>`;return}
  l.innerHTML=state.history.map(h=>`<div class="hist-item" style="--accent:${h.color}"><span class="hist-dot"></span><span class="hist-text">${trunc(h.text,26)}</span><span class="hist-time">${ftime(h.ts)}</span></div>`).join('');
}
function renderAll(){renderWheels();renderSections();renderHistory();document.getElementById('wheel-name').value=getActive()?.name||'';syncWheel()}
function syncWheel(){const w=getActive();if(w)spinEngine.setSections(w.sections)}

// ── Export / Import / Share ────────────────────────────
function exportJSON(){
  const w=getActive();if(!w)return;
  const b=new Blob([JSON.stringify(w,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`spinlux-${w.name||'wheel'}.json`;a.click();
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{try{const txt=await e.target.files[0].text();const d=JSON.parse(txt);d.id=uid();state.wheels.push(d);state.activeId=d.id;save();renderAll();toast('Roue importée !')}catch{toast('Fichier invalide','error')}};
  inp.click();
}
function shareWheel(){
  const w=getActive();if(!w)return;
  try{const b64=btoa(unescape(encodeURIComponent(JSON.stringify(w))));const url=new URL(location.href);url.searchParams.set('wheel',b64);navigator.clipboard.writeText(url.toString()).then(()=>toast(t('linkCopied')))}catch{toast('Erreur','error')}
}

// ── Init ───────────────────────────────────────────────
load();
// Check URL for shared wheel
try{const p=new URLSearchParams(location.search);const b64=p.get('wheel');if(b64){const w=JSON.parse(decodeURIComponent(escape(atob(b64))));w.id=uid();state.wheels.push(w);state.activeId=w.id;history.replaceState({},'',location.pathname)}}catch{}
if(!state.wheels.length){newWheel()}
else if(!state.activeId||!getActive())state.activeId=state.wheels[0].id;

spinEngine.init(document.getElementById('wheel-canvas'));
drawPin();
applyI18n();
renderAll();

// Update sound btn
function updateSoundBtn(){
  const b=document.getElementById('sound-btn');
  b.textContent=state.soundOn?'🔊':'🔇';
  b.classList.toggle('active',state.soundOn);
}
updateSoundBtn();

// ── Event Bindings ─────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.getElementById('spin-btn').addEventListener('click',()=>{
  if(spinEngine.spinning)return;
  const w=getActive();if(!w||w.sections.length<2)return toast(t('noSections'),'error');
  spinEngine.go();
});
document.getElementById('wheel-name').addEventListener('input',e=>{const w=getActive();if(w){w.name=e.target.value;save();renderWheels()}});
document.getElementById('add-section-btn').addEventListener('click',()=>{
  const w=getActive();if(!w)return;if(w.sections.length>=50)return toast('Max 50','error');
  const i=w.sections.length;w.sections.push({id:uid(),text:`Section ${i+1}`,color:getColor(i),weight:1});
  save();renderSections();syncWheel();
});
document.getElementById('new-wheel-btn').addEventListener('click',()=>{newWheel();renderAll()});
document.getElementById('save-btn').addEventListener('click',()=>{save();toast(t('saved'))});
document.getElementById('share-btn').addEventListener('click',shareWheel);
document.getElementById('export-btn').addEventListener('click',exportJSON);
document.getElementById('import-btn').addEventListener('click',importJSON);
document.getElementById('sound-btn').addEventListener('click',()=>{state.soundOn=!state.soundOn;save();updateSoundBtn()});
document.getElementById('fullscreen-btn').addEventListener('click',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()});
document.getElementById('weights-toggle').addEventListener('click',function(){
  state.showWeights=!state.showWeights;this.classList.toggle('active',state.showWeights);renderSections();
});
document.querySelectorAll('[data-template]').forEach(b=>b.addEventListener('click',()=>{
  const tpl=TPLS[b.dataset.template];if(!tpl)return;
  const w=getActive();if(!w)return;
  w.name=tpl.name;w.sections=tpl.sections.map(s=>({...s,id:uid()}));
  save();renderAll();toast('Template appliqué !');
}));
document.getElementById('result-close').addEventListener('click',closeModal);
document.getElementById('result-again').addEventListener('click',()=>{closeModal();setTimeout(()=>spinEngine.go(),300)});
document.getElementById('result-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById('clear-history-btn').addEventListener('click',()=>{state.history=[];save();renderHistory()});
</script>
