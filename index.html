<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpinLux | Neon Glow Anti-Gravity Wheel</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (for layout and utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        dark: '#030308',
                        panel: 'rgba(10, 10, 20, 0.65)',
                    }
                }
            }
        }
    </script>

    <style>
        /* ==========================================
           CORE STYLES & NEON GLOW VARIABLES
           ========================================== */
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #b026ff;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --bg-color: #030308;
            --wheel-size: 500px;
        }

        @media (max-width: 768px) {
            :root { --wheel-size: 320px; }
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            overscroll-behavior: none;
            /* Subtil background gradient */
            background-image: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #030308 100%);
        }

        /* Custom Scrollbar for premium feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.8); }

        /* ==========================================
           ANTI-GRAVITY & LEVITATION PHYSICS (60 FPS)
           ========================================== */
        .anti-gravity {
            animation: float 6s ease-in-out infinite;
            will-change: transform;
        }
        
        .anti-gravity-delayed {
            animation: float 7s ease-in-out infinite 1.5s;
            will-change: transform;
        }

        .anti-gravity-fast {
            animation: float-small 4s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes float-small {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* ==========================================
           NEON GLOW EFFECTS
           ========================================== */
        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-panel:hover {
            border-color: rgba(0, 243, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 243, 255, 0.1);
        }

        .neon-text-cyan {
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            color: #fff;
        }
        
        .neon-text-gold {
            text-shadow: 0 0 5px var(--neon-gold), 0 0 10px var(--neon-gold), 0 0 20px var(--neon-gold);
            color: #fff;
        }

        .neon-border-cyan {
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 5px var(--neon-cyan), inset 0 0 5px var(--neon-cyan);
        }

        .neon-btn {
            background: transparent;
            color: white;
            border: 1px solid var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255,0,255,0.2), inset 0 0 10px rgba(255,0,255,0.2);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .neon-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
        }

        .neon-btn:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 20px var(--neon-magenta), inset 0 0 15px var(--neon-magenta);
            transform: scale(1.05) translateY(-2px);
            text-shadow: 0 0 8px #fff;
        }

        .neon-btn:hover::before { left: 100%; }

        .neon-btn:active { transform: scale(0.95); }

        .neon-btn-cyan {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0,243,255,0.2), inset 0 0 10px rgba(0,243,255,0.2);
        }
        .neon-btn-cyan:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 15px var(--neon-cyan);
        }

        /* ==========================================
           WHEEL SPECIFICS
           ========================================== */
        #wheel-container {
            width: var(--wheel-size);
            height: var(--wheel-size);
            position: relative;
            border-radius: 50%;
            /* Outer glowing ring */
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2), 
                        inset 0 0 40px rgba(255, 0, 255, 0.2),
                        0 0 100px rgba(0, 243, 255, 0.1);
            border: 4px solid rgba(255, 255, 255, 0.1);
            perspective: 1000px;
            z-index: 10;
        }

        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Hardware acceleration for rotation */
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* The Pointer / Selector */
        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            background: clip-path(polygon(50% 100%, 0 0, 100% 0));
            z-index: 20;
            filter: drop-shadow(0 0 15px var(--neon-cyan));
            display: flex;
            justify-content: center;
        }
        
        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #fff; /* White core */
            filter: drop-shadow(0 0 5px var(--neon-cyan));
        }

        /* ==========================================
           MODALS & OVERLAYS
           ========================================== */
        #result-modal {
            background: rgba(3, 3, 8, 0.85);
            backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }
        
        #result-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .result-content {
            transform: scale(0.8) translateY(50px);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #result-modal.active .result-content {
            transform: scale(1) translateY(0);
        }

        /* ==========================================
           UI ELEMENTS (Inputs, Lists)
           ========================================== */
        input[type="text"], input[type="number"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .segment-item {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .segment-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        .segment-item.dragging {
            opacity: 0.5;
            background: rgba(0, 243, 255, 0.1);
        }

        /* Particles Canvas - Background */
        #bg-particles, #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        #confetti-canvas { z-index: 90; }

        /* Flags */
        .lang-flag {
            cursor: pointer;
            filter: grayscale(100%) opacity(0.5);
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }
        .lang-flag:hover { filter: grayscale(0%) opacity(1) drop-shadow(0 0 10px #fff); transform: scale(1.2); }
        .lang-flag.active { filter: grayscale(0%) opacity(1) drop-shadow(0 0 10px var(--neon-cyan)); }

        /* Tabs */
        .tab-btn {
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.6;
        }
        .tab-btn:hover { opacity: 1; }
        .tab-btn.active {
            opacity: 1;
            border-bottom-color: var(--neon-cyan);
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Background Particles Canvas -->
    <canvas id="bg-particles"></canvas>
    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Header -->
    <header class="relative z-50 flex justify-between items-center p-4 md:p-6 glass-panel rounded-none border-t-0 border-l-0 border-r-0">
        <div class="flex items-center gap-3">
            <div class="text-3xl font-orbitron font-black tracking-wider anti-gravity-fast cursor-pointer" onclick="location.reload()">
                <span class="neon-text-cyan">SPIN</span><span class="text-white">LUX</span>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <!-- Audio Toggle -->
            <button id="btn-audio" class="text-gray-400 hover:text-white transition-colors" title="Toggle Sound">
                <i class="fas fa-volume-up text-xl drop-shadow-[0_0_5px_currentColor]"></i>
            </button>
            
            <!-- Fullscreen -->
            <button id="btn-fullscreen" class="text-gray-400 hover:text-white transition-colors hidden md:block" title="Fullscreen">
                <i class="fas fa-expand text-xl drop-shadow-[0_0_5px_currentColor]"></i>
            </button>

            <!-- Language Selector -->
            <div class="flex gap-3">
                <span class="lang-flag active" data-lang="fr" title="Français">🇫🇷</span>
                <span class="lang-flag" data-lang="en" title="English">🇬🇧</span>
                <span class="lang-flag" data-lang="es" title="Español">🇪🇸</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow flex flex-col lg:flex-row p-4 md:p-8 gap-8 relative z-10 max-w-screen-2xl mx-auto w-full">
        
        <!-- Left Side: The Wheel -->
        <section class="flex-1 flex flex-col items-center justify-center min-h-[50vh] lg:min-h-0 relative">
            <div class="anti-gravity flex flex-col items-center">
                <!-- Wheel Wrapper -->
                <div id="wheel-container" class="cursor-pointer group">
                    <div class="wheel-pointer"></div>
                    <!-- The Canvas rotated by JS -->
                    <canvas id="wheel-canvas" width="1000" height="1000"></canvas>
                    
                    <!-- Center Decor -->
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-dark rounded-full border-4 border-white z-10 shadow-[0_0_20px_#fff] flex items-center justify-center">
                        <div class="w-6 h-6 rounded-full bg-black neon-border-cyan animate-pulse"></div>
                    </div>
                </div>

                <!-- Spin Button -->
                <button id="btn-spin" class="mt-12 px-12 py-4 rounded-full neon-btn text-2xl font-bold w-64">
                    <span data-i18n="spin_btn">LANCER</span>
                </button>
            </div>
        </section>

        <!-- Right Side: Controls & Data -->
        <section class="w-full lg:w-[450px] flex flex-col gap-4 anti-gravity-delayed">
            
            <!-- Tools Panel -->
            <div class="glass-panel p-5 flex flex-col h-[600px]">
                
                <!-- Tabs -->
                <div class="flex border-b border-gray-700 mb-4 font-orbitron text-sm">
                    <button class="tab-btn active flex-1 pb-2" data-tab="segments">
                        <i class="fas fa-list mr-2"></i><span data-i18n="tab_segments">ÉLÉMENTS</span>
                    </button>
                    <button class="tab-btn flex-1 pb-2" data-tab="templates">
                        <i class="fas fa-magic mr-2"></i><span data-i18n="tab_templates">MODÈLES</span>
                    </button>
                    <button class="tab-btn flex-1 pb-2" data-tab="history">
                        <i class="fas fa-history mr-2"></i><span data-i18n="tab_history">HISTORIQUE</span>
                    </button>
                </div>

                <!-- Tab Content: Segments -->
                <div id="tab-segments" class="tab-content flex-grow flex flex-col overflow-hidden">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm text-gray-400" id="segment-count">2/50 <span data-i18n="items">éléments</span></span>
                        <div class="flex gap-2">
                            <button id="btn-share" class="text-xs neon-btn neon-btn-cyan px-3 py-1 rounded" title="Share URL">
                                <i class="fas fa-share-alt"></i>
                            </button>
                            <button id="btn-shuffle" class="text-xs neon-btn px-3 py-1 rounded" title="Shuffle">
                                <i class="fas fa-random"></i>
                            </button>
                            <button id="btn-clear" class="text-xs border border-red-500 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded transition-colors" title="Clear">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Segment List (Scrollable) -->
                    <div id="segment-list" class="flex-grow overflow-y-auto pr-2 space-y-2 mb-4">
                        <!-- JS injected segments -->
                    </div>

                    <!-- Add New -->
                    <form id="add-form" class="flex gap-2 mt-auto pt-4 border-t border-gray-700">
                        <input type="color" id="add-color" class="w-10 h-10 rounded cursor-pointer bg-transparent border-none p-0">
                        <input type="text" id="add-text" class="flex-grow rounded px-3 py-2 text-sm" placeholder="Nouvel élément..." required autocomplete="off">
                        <button type="submit" class="neon-btn neon-btn-cyan px-4 rounded">
                            <i class="fas fa-plus"></i>
                        </button>
                    </form>
                </div>

                <!-- Tab Content: Templates -->
                <div id="tab-templates" class="tab-content hidden flex-grow overflow-y-auto pr-2 space-y-3">
                    <div class="text-sm text-gray-400 mb-4" data-i18n="template_desc">Remplacez la roue actuelle par un modèle rapide.</div>
                    <!-- JS injected templates -->
                </div>

                <!-- Tab Content: History -->
                <div id="tab-history" class="tab-content hidden flex-grow overflow-y-auto pr-2">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-gray-400" data-i18n="history_desc">10 derniers résultats</span>
                        <button id="btn-clear-history" class="text-xs text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                    </div>
                    <ul id="history-list" class="space-y-2">
                        <!-- JS injected history -->
                        <li class="text-gray-500 text-sm italic text-center mt-10" data-i18n="history_empty">Aucun résultat pour le moment.</li>
                    </ul>
                </div>

            </div>
        </section>
    </main>

    <!-- Result Modal (Full Screen Overlay) -->
    <div id="result-modal" class="fixed inset-0 flex items-center justify-center">
        <div class="result-content flex flex-col items-center anti-gravity">
            <h2 class="text-2xl font-orbitron text-gray-300 mb-4 tracking-widest" data-i18n="winner_title">GAGNANT !</h2>
            <div id="winner-text" class="text-6xl md:text-8xl font-black font-orbitron text-center px-4 neon-text-gold break-words max-w-screen-lg">
                RESULT
            </div>
            <button id="btn-close-modal" class="mt-12 neon-btn neon-btn-cyan px-8 py-3 rounded-full text-lg">
                <span data-i18n="close_btn">CONTINUER</span>
            </button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-dark border border-gray-600 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        Message
    </div>

    <script>
        /* ==========================================================================
           1. CORE DATA & STATE MANAGEMENT
           ========================================================================== */
        
        // Neon Color Palette
        const neonColors = [
            '#00f3ff', '#ff00ff', '#39ff14', '#ffd700', '#b026ff', 
            '#ff3131', '#00ff00', '#1f51ff', '#ff1493', '#00ffff'
        ];

        // App State
        const state = {
            segments: [],
            history: [],
            isSpinning: false,
            currentRotation: 0,
            soundEnabled: true,
            lang: 'fr'
        };

        // Templates
        const templates = {
            'yes_no': {
                fr: "Oui / Non", en: "Yes / No", es: "Sí / No",
                data: [{text: "OUI", color: "#39ff14"}, {text: "NON", color: "#ff3131"}]
            },
            'numbers': {
                fr: "Chiffres 1-10", en: "Numbers 1-10", es: "Números 1-10",
                data: Array.from({length: 10}, (_, i) => ({text: `${i+1}`, color: neonColors[i%neonColors.length]}))
            },
            'days': {
                fr: "Jours de la semaine", en: "Days of week", es: "Días de la semana",
                data: [
                    {text: "Lundi", color: neonColors[0]}, {text: "Mardi", color: neonColors[1]},
                    {text: "Mercredi", color: neonColors[2]}, {text: "Jeudi", color: neonColors[3]},
                    {text: "Vendredi", color: neonColors[4]}, {text: "Samedi", color: neonColors[5]},
                    {text: "Dimanche", color: neonColors[6]}
                ]
            }
        };

        // Translations Dictionary
        const i18n = {
            fr: {
                spin_btn: "LANCER LA ROUE",
                tab_segments: "ÉLÉMENTS",
                tab_templates: "MODÈLES",
                tab_history: "HISTORIQUE",
                items: "éléments",
                placeholder_add: "Nouvel élément...",
                template_desc: "Remplacez la roue actuelle par un modèle rapide.",
                history_desc: "10 derniers résultats",
                history_empty: "Aucun résultat pour le moment.",
                winner_title: "LE RÉSULTAT EST :",
                close_btn: "CONTINUER",
                msg_min_segments: "Il faut au moins 2 éléments pour lancer la roue.",
                msg_copied: "Lien copié dans le presse-papier !",
                msg_cleared: "Roue vidée."
            },
            en: {
                spin_btn: "SPIN THE WHEEL",
                tab_segments: "SEGMENTS",
                tab_templates: "TEMPLATES",
                tab_history: "HISTORY",
                items: "items",
                placeholder_add: "New item...",
                template_desc: "Replace current wheel with a quick template.",
                history_desc: "Last 10 results",
                history_empty: "No results yet.",
                winner_title: "THE RESULT IS:",
                close_btn: "CONTINUE",
                msg_min_segments: "You need at least 2 segments to spin.",
                msg_copied: "Link copied to clipboard!",
                msg_cleared: "Wheel cleared."
            },
            es: {
                spin_btn: "GIRAR LA RULETA",
                tab_segments: "ELEMENTOS",
                tab_templates: "PLANTILLAS",
                tab_history: "HISTORIAL",
                items: "elementos",
                placeholder_add: "Nuevo elemento...",
                template_desc: "Reemplazar la ruleta actual con una plantilla.",
                history_desc: "Últimos 10 resultados",
                history_empty: "Sin resultados aún.",
                winner_title: "EL RESULTADO ES:",
                close_btn: "CONTINUAR",
                msg_min_segments: "Necesitas al menos 2 elementos para girar.",
                msg_copied: "¡Enlace copiado al portapapeles!",
                msg_cleared: "Ruleta vaciada."
            }
        };

        // DOM Elements
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const listEl = document.getElementById('segment-list');
        const spinBtn = document.getElementById('btn-spin');
        const wheelContainer = document.getElementById('wheel-container');

        /* ==========================================================================
           2. AUDIO SYSTEM (Synthesized, no external files)
           ========================================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            if (!state.soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            // High tech click sound
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWin() {
            if (!state.soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            // Crystal clear win chord
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C major chord
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.1 + (i*0.05));
                gain.gain.exponentialRampToValueAtTime(0.01, now + 2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 2);
            });
        }

        /* ==========================================================================
           3. WHEEL RENDERING (Canvas 60 FPS)
           ========================================================================== */
        
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 10; // Padding for shadow

            ctx.clearRect(0, 0, width, height);

            if (state.segments.length === 0) return;

            const sliceAngle = (2 * Math.PI) / state.segments.length;

            state.segments.forEach((segment, index) => {
                const startAngle = index * sliceAngle - Math.PI / 2;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                // Gradient for premium metallic/neon look
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                // Convert hex to rgb for opacity manipulation
                const r = parseInt(segment.color.slice(1, 3), 16);
                const g = parseInt(segment.color.slice(3, 5), 16);
                const b = parseInt(segment.color.slice(5, 7), 16);
                
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.2)`);
                gradient.addColorStop(0.8, segment.color);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0.8)`);

                ctx.fillStyle = gradient;
                ctx.fill();

                // Slice Borders (Neon inner lines)
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#050510';
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                // Rotate to center of slice
                ctx.rotate(startAngle + sliceAngle / 2);
                
                // Text styling
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 45px Orbitron, sans-serif';
                
                // Shadow for legibility (glow)
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Truncate text if too long
                let text = segment.text;
                if (text.length > 15) text = text.substring(0, 13) + '...';

                // Distance from center
                ctx.fillText(text, radius - 40, 0);
                ctx.restore();
            });

            // Center inner circle (metallic joint)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
            ctx.fillStyle = '#030308';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        /* ==========================================================================
           4. SPIN PHYSICS & ANIMATION
           ========================================================================== */
        
        // Custom Easing: easeOutBack for that anti-gravity bounce
        function easeOutBack(t, b, c, d, s = 1.2) {
            return c * ((t = t / d - 1) * t * ((s + 1) * t + s) + 1) + b;
        }

        function spinWheel() {
            if (state.isSpinning || state.segments.length < 2) {
                if(state.segments.length < 2) showToast(i18n[state.lang].msg_min_segments);
                return;
            }

            initAudio(); // Required by browsers to unlock audio on first interaction
            state.isSpinning = true;
            spinBtn.style.opacity = '0.5';
            spinBtn.style.pointerEvents = 'none';

            // Remove float animation during spin for realistic physics, keep hardware accel
            wheelContainer.parentElement.classList.remove('anti-gravity');

            // Physics params
            const spinTimeTotal = 6000 + Math.random() * 2000; // 6-8 seconds
            const spins = 10 + Math.random() * 5; // 10-15 full rotations
            
            // Target angle calculation
            const targetRotation = state.currentRotation + (spins * 360) + (Math.random() * 360);
            const startRotation = state.currentRotation;
            const changeInRotation = targetRotation - startRotation;

            let startTime = null;
            let lastTickAngle = startRotation;

            function animate(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsedTime = currentTime - startTime;

                if (elapsedTime < spinTimeTotal) {
                    // Calculate current angle with easing
                    state.currentRotation = easeOutBack(elapsedTime, startRotation, changeInRotation, spinTimeTotal, 1.1);
                    
                    // Apply rotation via CSS transform for 60FPS hardware acceleration
                    canvas.style.transform = `rotate(${state.currentRotation}deg)`;

                    // Tick sound logic (trigger when passing a segment boundary)
                    const sliceAngle = 360 / state.segments.length;
                    // Adjust rotation to account for initial pointer position (-90deg offset in draw)
                    const normalizedCurrent = (state.currentRotation) % 360;
                    const normalizedLast = (lastTickAngle) % 360;
                    
                    // Detect boundary cross
                    if (Math.floor(normalizedCurrent / sliceAngle) !== Math.floor(normalizedLast / sliceAngle) || 
                        Math.abs(normalizedCurrent - normalizedLast) > sliceAngle) {
                        playTick();
                    }
                    lastTickAngle = state.currentRotation;

                    requestAnimationFrame(animate);
                } else {
                    // Animation finished
                    state.currentRotation = targetRotation % 360;
                    canvas.style.transform = `rotate(${state.currentRotation}deg)`;
                    state.isSpinning = false;
                    spinBtn.style.opacity = '1';
                    spinBtn.style.pointerEvents = 'all';
                    
                    // Restore anti-gravity
                    wheelContainer.parentElement.classList.add('anti-gravity');

                    calculateResult();
                }
            }

            requestAnimationFrame(animate);
        }

        function calculateResult() {
            // Pointer is at the top (270 degrees mathematically, but in our CSS rotation context, 
            // the top is 0 relative to the container, minus the rotation applied).
            // Canvas rotates clockwise.
            const sliceAngle = 360 / state.segments.length;
            
            // We need to find which slice is at the top (0 degrees).
            // Current rotation tells us how much the wheel turned clockwise.
            // So the top is at -currentRotation.
            let normalizedRotation = state.currentRotation % 360;
            if (normalizedRotation < 0) normalizedRotation += 360; // strictly positive

            // The slice that is at the top is the one offset by the rotation.
            // Because our drawing starts at -90deg (top), index 0 is at top when rotation is 0.
            // As we rotate positive, index 0 moves right. So the top slice index increases backwards.
            let winningIndex = Math.floor((360 - normalizedRotation) / sliceAngle) % state.segments.length;
            
            const winner = state.segments[winningIndex];
            
            // Update History
            state.history.unshift({ text: winner.text, color: winner.color, time: new Date() });
            if (state.history.length > 10) state.history.pop();
            renderHistory();
            saveData();

            showWinnerModal(winner);
        }

        /* ==========================================================================
           5. UI & DOM MANIPULATION
           ========================================================================== */

        function initApp() {
            // Setup Event Listeners
            spinBtn.addEventListener('click', spinWheel);
            wheelContainer.addEventListener('click', spinWheel);
            
            document.getElementById('add-form').addEventListener('submit', (e) => {
                e.preventDefault();
                addSegment();
            });

            document.getElementById('btn-clear').addEventListener('click', () => {
                state.segments = [];
                updateWheel();
                showToast(i18n[state.lang].msg_cleared);
            });

            document.getElementById('btn-shuffle').addEventListener('click', () => {
                state.segments.sort(() => Math.random() - 0.5);
                updateWheel();
            });

            document.getElementById('btn-share').addEventListener('click', shareUrl);

            document.getElementById('btn-audio').addEventListener('click', (e) => {
                state.soundEnabled = !state.soundEnabled;
                e.currentTarget.innerHTML = state.soundEnabled ? 
                    '<i class="fas fa-volume-up text-xl drop-shadow-[0_0_5px_currentColor]"></i>' : 
                    '<i class="fas fa-volume-mute text-xl text-gray-600"></i>';
            });

            document.getElementById('btn-fullscreen').addEventListener('click', toggleFullScreen);

            document.getElementById('btn-close-modal').addEventListener('click', closeWinnerModal);

            document.getElementById('btn-clear-history').addEventListener('click', () => {
                state.history = [];
                renderHistory();
                saveData();
            });

            // Tabs setup
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'border-b-cyan-400', 'text-cyan-400'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                    
                    btn.classList.add('active');
                    document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
                });
            });

            // Language setup
            document.querySelectorAll('.lang-flag').forEach(flag => {
                flag.addEventListener('click', (e) => {
                    document.querySelectorAll('.lang-flag').forEach(f => f.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    setLanguage(e.currentTarget.dataset.lang);
                });
            });

            // Color picker random init
            document.getElementById('add-color').value = neonColors[Math.floor(Math.random() * neonColors.length)];

            // Load Data
            loadData();
            setLanguage(state.lang);
            renderTemplates();
            
            // Start Canvas loops
            drawWheel();
            initParticles();
            initConfetti();
        }

        function addSegment() {
            if (state.segments.length >= 50) return;
            const textInput = document.getElementById('add-text');
            const colorInput = document.getElementById('add-color');
            const text = textInput.value.trim();
            
            if (text) {
                state.segments.push({ text: text, color: colorInput.value });
                textInput.value = '';
                // Cycle color for next input
                colorInput.value = neonColors[state.segments.length % neonColors.length];
                updateWheel();
            }
        }

        function removeSegment(index) {
            state.segments.splice(index, 1);
            updateWheel();
        }

        function updateWheel() {
            drawWheel();
            renderSegmentsList();
            saveData();
            document.getElementById('segment-count').innerHTML = `${state.segments.length}/50 <span data-i18n="items">${i18n[state.lang].items}</span>`;
            updateURLHash();
        }

        function renderSegmentsList() {
            listEl.innerHTML = '';
            state.segments.forEach((seg, index) => {
                const li = document.createElement('div');
                li.className = 'segment-item flex items-center justify-between bg-dark/50 p-2 rounded border border-gray-800 cursor-grab';
                li.draggable = true;
                li.dataset.index = index;
                
                // Color indicator
                const colorDot = document.createElement('div');
                colorDot.className = 'w-4 h-4 rounded-full mr-3 shadow-lg';
                colorDot.style.backgroundColor = seg.color;
                colorDot.style.boxShadow = `0 0 10px ${seg.color}`;

                // Text
                const span = document.createElement('span');
                span.className = 'flex-grow font-semibold text-sm truncate';
                span.textContent = seg.text;

                // Delete btn
                const delBtn = document.createElement('button');
                delBtn.className = 'text-gray-500 hover:text-red-500 transition-colors ml-2';
                delBtn.innerHTML = '<i class="fas fa-times"></i>';
                delBtn.onclick = () => removeSegment(index);

                // Drag handles
                li.addEventListener('dragstart', handleDragStart);
                li.addEventListener('dragover', handleDragOver);
                li.addEventListener('drop', handleDrop);
                li.addEventListener('dragend', handleDragEnd);

                const leftWrapper = document.createElement('div');
                leftWrapper.className = 'flex items-center w-[85%] overflow-hidden';
                leftWrapper.appendChild(colorDot);
                leftWrapper.appendChild(span);

                li.appendChild(leftWrapper);
                li.appendChild(delBtn);
                listEl.appendChild(li);
            });
        }

        // Drag & Drop implementation
        let dragSrcEl = null;
        function handleDragStart(e) {
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.index);
            this.classList.add('dragging');
        }
        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcEl !== this) {
                const srcIndex = parseInt(e.dataTransfer.getData('text/plain'));
                const destIndex = parseInt(this.dataset.index);
                
                // Swap in array
                const item = state.segments.splice(srcIndex, 1)[0];
                state.segments.splice(destIndex, 0, item);
                updateWheel();
            }
            return false;
        }
        function handleDragEnd(e) {
            this.classList.remove('dragging');
        }

        function renderTemplates() {
            const container = document.getElementById('tab-templates');
            // Keep the description text, remove buttons
            Array.from(container.children).forEach(c => {
                if(c.tagName === 'BUTTON') c.remove();
            });

            Object.keys(templates).forEach(key => {
                const tpl = templates[key];
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded glass-panel hover:bg-white/5 transition-all mb-2 flex justify-between items-center group';
                btn.innerHTML = `
                    <span class="font-orbitron text-sm group-hover:text-cyan-400 transition-colors">${tpl[state.lang] || tpl.en}</span>
                    <i class="fas fa-arrow-right text-gray-600 group-hover:text-cyan-400 transition-colors"></i>
                `;
                btn.onclick = () => {
                    // Deep copy array
                    state.segments = JSON.parse(JSON.stringify(tpl.data));
                    updateWheel();
                };
                container.appendChild(btn);
            });
        }

        function renderHistory() {
            const ul = document.getElementById('history-list');
            ul.innerHTML = '';
            if (state.history.length === 0) {
                ul.innerHTML = `<li class="text-gray-500 text-sm italic text-center mt-10" data-i18n="history_empty">${i18n[state.lang].history_empty}</li>`;
                return;
            }

            state.history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-2 border-b border-gray-800/50 text-sm';
                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div class="w-3 h-3 rounded-full shadow-[0_0_5px_currentColor]" style="background-color: ${item.color}; color: ${item.color}"></div>
                        <span class="truncate font-semibold">${item.text}</span>
                    </div>
                `;
                ul.appendChild(li);
            });
        }

        // Win Modal
        function showWinnerModal(winner) {
            playWin();
            const modal = document.getElementById('result-modal');
            const text = document.getElementById('winner-text');
            
            text.textContent = winner.text;
            text.style.color = '#fff';
            text.style.textShadow = `0 0 10px ${winner.color}, 0 0 20px ${winner.color}, 0 0 40px ${winner.color}`;
            
            modal.classList.add('active');
            fireConfetti(winner.color);
        }

        function closeWinnerModal() {
            document.getElementById('result-modal').classList.remove('active');
            stopConfetti();
        }

        // i18n
        function setLanguage(langCode) {
            if (!i18n[langCode]) return;
            state.lang = langCode;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[langCode][key]) {
                    if (el.tagName === 'INPUT' && el.type === 'text') {
                        el.placeholder = i18n[langCode][key];
                    } else {
                        el.textContent = i18n[langCode][key];
                    }
                }
            });

            // Update flags
            document.querySelectorAll('.lang-flag').forEach(f => {
                f.classList.toggle('active', f.dataset.lang === langCode);
            });

            renderTemplates(); // Re-render template names
            document.getElementById('segment-count').innerHTML = `${state.segments.length}/50 <span data-i18n="items">${i18n[langCode].items}</span>`;
            saveData();
        }

        /* ==========================================================================
           6. DATA PERSISTENCE & SHARING
           ========================================================================== */

        function saveData() {
            try {
                const dataToSave = {
                    segments: state.segments,
                    history: state.history,
                    lang: state.lang
                };
                localStorage.setItem('spinlux_data', JSON.stringify(dataToSave));
            } catch (e) { console.warn("LocalStorage not available"); }
        }

        function loadData() {
            // First check URL for shared wheel
            if (window.location.hash.length > 1) {
                try {
                    const encoded = window.location.hash.substring(1);
                    const decoded = decodeURIComponent(escape(window.atob(encoded)));
                    const sharedData = JSON.parse(decoded);
                    if (Array.isArray(sharedData) && sharedData.length > 0) {
                        state.segments = sharedData;
                        window.location.hash = ''; // clear hash
                        updateWheel();
                        showToast("Roue partagée chargée !");
                        return; // Done loading
                    }
                } catch (e) {
                    console.error("Failed to parse shared URL", e);
                }
            }

            // Fallback to LocalStorage
            try {
                const saved = localStorage.getItem('spinlux_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.segments = parsed.segments || [];
                    state.history = parsed.history || [];
                    if (parsed.lang) state.lang = parsed.lang;
                }
            } catch (e) { console.warn("Could not read local storage"); }

            // Fallback to Default Template if empty
            if (state.segments.length === 0) {
                state.segments = JSON.parse(JSON.stringify(templates.yes_no.data));
            }
            
            updateWheel();
            renderHistory();
        }

        function updateURLHash() {
            // Optional: Auto update hash on every change. 
            // Disabled to keep URL clean until user explicitly shares.
        }

        function shareUrl() {
            try {
                // Encode array: to JSON -> encodeURI to handle emojis -> btoa
                const json = JSON.stringify(state.segments);
                const base64 = window.btoa(unescape(encodeURIComponent(json)));
                const url = window.location.origin + window.location.pathname + '#' + base64;
                
                // Copy to clipboard
                const el = document.createElement('textarea');
                el.value = url;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                
                showToast(i18n[state.lang].msg_copied);
            } catch(e) {
                console.error("Export failed", e);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 3000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        /* ==========================================================================
           7. VISUAL EFFECTS (Anti-Gravity Particles 60FPS)
           ========================================================================== */

        const bgCanvas = document.getElementById('bg-particles');
        const bgCtx = bgCanvas.getContext('2d');
        let bgParticles = [];

        function initParticles() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgParticles = Array.from({length: 50}, () => createParticle());
            animateParticles();
        }

        function createParticle() {
            return {
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 0.5,
                speedY: -(Math.random() * 0.5 + 0.1), // Anti-gravity (moves up)
                speedX: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5 + 0.1,
                color: neonColors[Math.floor(Math.random() * neonColors.length)]
            };
        }

        function animateParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            bgParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                
                // Reset if out of bounds (top)
                if (p.y < -10) {
                    p.y = bgCanvas.height + 10;
                    p.x = Math.random() * bgCanvas.width;
                }

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                bgCtx.fillStyle = p.color;
                bgCtx.globalAlpha = p.opacity;
                // Add tiny glow
                bgCtx.shadowBlur = 5;
                bgCtx.shadowColor = p.color;
                bgCtx.fill();
            });
            bgCtx.globalAlpha = 1;
            bgCtx.shadowBlur = 0;

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        });

        // Confetti Engine
        const confCanvas = document.getElementById('confetti-canvas');
        const confCtx = confCanvas.getContext('2d');
        let confettis = [];
        let confettiAnimationId = null;

        function fireConfetti(color) {
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;
            confettis = [];
            
            for (let i = 0; i < 150; i++) {
                confettis.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    size: Math.random() * 8 + 4,
                    speedX: (Math.random() - 0.5) * 20,
                    speedY: (Math.random() - 0.5) * 20 - 5, // Bias upwards initially
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10,
                    color: Math.random() > 0.5 ? color : '#fff',
                    life: 1
                });
            }

            if(confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            animateConfetti();
        }

        function animateConfetti() {
            confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
            let active = false;

            confettis.forEach(c => {
                if (c.life > 0) {
                    active = true;
                    // Anti-gravity physics
                    c.x += c.speedX;
                    c.y += c.speedY;
                    c.speedY -= 0.1; // accelerate upwards (anti-gravity!)
                    c.speedX *= 0.98; // friction
                    c.rotation += c.rotationSpeed;
                    c.life -= 0.005; // Fade out

                    confCtx.save();
                    confCtx.translate(c.x, c.y);
                    confCtx.rotate(c.rotation * Math.PI / 180);
                    confCtx.globalAlpha = Math.max(0, c.life);
                    confCtx.fillStyle = c.color;
                    confCtx.shadowBlur = 15;
                    confCtx.shadowColor = c.color;
                    confCtx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
                    confCtx.restore();
                }
            });

            if (active) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            }
        }

        function stopConfetti() {
            confettis = [];
            confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
            if(confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
        }

        /* ==========================================================================
           8. BOOTSTRAP
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
