<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#050510" />
  <title>SpinLux • Neon Wheel Spinner</title>
  <style>
    :root{
      --bg:#050510;
      --bg2:#09091a;
      --panel:rgba(10,12,26,.72);
      --panel2:rgba(12,14,30,.88);
      --line:rgba(120,180,255,.18);
      --text:#ebf3ff;
      --muted:#97a3c7;
      --cyan:#40f5ff;
      --magenta:#ff4fd8;
      --violet:#9e6bff;
      --acid:#b8ff4f;
      --gold:#ffd56b;
      --danger:#ff6b8b;
      --shadow:0 0 18px rgba(64,245,255,.28),0 0 42px rgba(255,79,216,.15),0 0 80px rgba(158,107,255,.10);
      --radius:22px;
      --radius2:30px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:
      radial-gradient(circle at 20% 20%, rgba(255,79,216,.10), transparent 18%),
      radial-gradient(circle at 80% 20%, rgba(64,245,255,.10), transparent 18%),
      radial-gradient(circle at 50% 80%, rgba(158,107,255,.12), transparent 20%),
      linear-gradient(180deg, #04040a 0%, #050510 50%, #04040a 100%);
      color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
      background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:40px 40px;mask-image:radial-gradient(circle at center, black 30%, transparent 100%);
      transform:translateZ(0);
    }
    .app{position:relative;width:100%;height:100%;display:grid;grid-template-columns:380px 1fr 340px;gap:18px;padding:18px}
    .panel{
      background:linear-gradient(180deg, rgba(16,18,38,.82), rgba(8,10,22,.72));
      border:1px solid rgba(120,180,255,.16);
      border-radius:var(--radius2);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(18px) saturate(160%);
      position:relative;overflow:hidden;
      transform:translateZ(0);
      animation:float 6s ease-in-out infinite;
    }
    .panel::after{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(135deg, rgba(64,245,255,.14), transparent 22%, transparent 78%, rgba(255,79,216,.10));
      mix-blend-mode:screen;opacity:.65;
    }
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .left,.right{display:flex;flex-direction:column;gap:16px;min-height:0}
    .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
    .brand{padding:18px 18px 8px}
    .brand h1{margin:0;font-size:34px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 14px rgba(64,245,255,.6),0 0 24px rgba(255,79,216,.35)}
    .brand p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .chiprow{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 18px}
    .chip{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid rgba(120,180,255,.15);color:#dbe7ff;font-size:12px;box-shadow:inset 0 0 16px rgba(64,245,255,.04)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
    .lang{display:flex;gap:8px}
    .lang button,.btn,.iconbtn,.tab,.smallbtn{
      cursor:pointer;border:1px solid rgba(120,180,255,.18);background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color:var(--text);border-radius:16px;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease, opacity .18s ease;
      box-shadow:0 0 0 rgba(0,0,0,0);
      will-change:transform;
    }
    .lang button:hover,.btn:hover,.iconbtn:hover,.tab:hover,.smallbtn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 16px rgba(64,245,255,.18),0 0 28px rgba(255,79,216,.12);border-color:rgba(64,245,255,.45)}
    .lang button{width:40px;height:40px;font-size:20px}
    .lang button.active{box-shadow:0 0 18px rgba(64,245,255,.34),0 0 30px rgba(255,79,216,.16);border-color:rgba(184,255,79,.5)}
    .section{padding:16px}
    .section h2{margin:0 0 12px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#d9e6ff;text-shadow:0 0 10px rgba(64,245,255,.22)}
    .row{display:flex;gap:10px;align-items:center}
    .col{display:flex;flex-direction:column;gap:8px}
    label{font-size:12px;color:var(--muted)}
    input[type="text"],input[type="number"],textarea,select{
      width:100%;border-radius:14px;border:1px solid rgba(120,180,255,.18);background:rgba(5,6,16,.72);color:var(--text);
      padding:12px 14px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);transition:border-color .18s ease, box-shadow .18s ease;
    }
    input:focus,textarea:focus,select:focus{border-color:rgba(64,245,255,.65);box-shadow:0 0 0 3px rgba(64,245,255,.12),0 0 18px rgba(64,245,255,.08)}
    textarea{min-height:84px;resize:vertical}
    .btn{padding:14px 18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .btn.primary{
      background:linear-gradient(180deg, rgba(64,245,255,.22), rgba(255,79,216,.10));
      border-color:rgba(64,245,255,.42);box-shadow:0 0 18px rgba(64,245,255,.18),0 0 40px rgba(255,79,216,.12), inset 0 0 20px rgba(255,255,255,.03)
    }
    .btn.spin{font-size:18px;padding:18px 20px;border-radius:20px;background:linear-gradient(135deg, rgba(64,245,255,.24), rgba(158,107,255,.20), rgba(255,79,216,.16));animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
    .wheelwrap{position:relative;width:min(72vmin, 720px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transform-style:preserve-3d;perspective:1200px}
    .halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle, rgba(64,245,255,.15), transparent 44%, rgba(255,79,216,.10) 55%, transparent 70%);filter:blur(18px);animation:halo 4s linear infinite}
    @keyframes halo{to{transform:rotate(360deg)}}
    canvas{width:100%;height:100%;display:block;border-radius:50%;background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.03), rgba(0,0,0,.0) 52%, rgba(0,0,0,.18) 100%);box-shadow:0 0 0 1px rgba(255,255,255,.03),0 0 70px rgba(64,245,255,.10),0 0 120px rgba(255,79,216,.08)}
    .pointer{
      position:absolute;top:-2.5%;left:50%;transform:translateX(-50%);
      width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:38px solid var(--gold);
      filter:drop-shadow(0 0 16px rgba(255,213,107,.85)) drop-shadow(0 0 28px rgba(255,79,216,.35));
    }
    .centercap{
      position:absolute;width:16%;aspect-ratio:1;border-radius:50%;
      background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.30), rgba(255,255,255,.06) 20%, rgba(8,10,22,.92) 55%, rgba(64,245,255,.18) 100%);
      border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 8px rgba(64,245,255,.04),0 0 24px rgba(64,245,255,.24),0 0 50px rgba(255,79,216,.14)
    }
    .floating{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
    .particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px currentColor,0 0 22px currentColor;opacity:.85;animation:drift var(--dur) linear infinite}
    @keyframes drift{from{transform:translate3d(var(--x),110%,0)}to{transform:translate3d(calc(var(--x) + var(--dx)), -20%, 0)}}
    .history{display:grid;gap:10px;max-height:280px;overflow:auto;padding-right:4px}
    .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(120,180,255,.12)}
    .item b{font-size:13px}
    .item span{color:var(--muted);font-size:12px}
    .sectionlist{display:grid;gap:10px;max-height:42vh;overflow:auto;padding-right:4px}
    .card{
      background:rgba(255,255,255,.035);border:1px solid rgba(120,180,255,.12);border-radius:18px;padding:12px;
      box-shadow:inset 0 0 16px rgba(64,245,255,.03);animation:float 7s ease-in-out infinite
    }
    .cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
    .handle{cursor:grab;color:#cbe1ff;font-size:14px;user-select:none}
    .swatch{width:32px;height:32px;border:none;border-radius:12px;padding:0;background:transparent}
    .mini{display:flex;gap:8px}
    .smallbtn{padding:10px 12px;border-radius:12px;font-size:12px}
    .toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:#d9e6ff}
    .switch{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(120,180,255,.16);position:relative;cursor:pointer}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,var(--cyan),var(--magenta));box-shadow:0 0 16px rgba(64,245,255,.5);transition:transform .2s ease}
    .switch.on{background:rgba(64,245,255,.16)}
    .switch.on::after{transform:translateX(20px)}
    .result{
      position:fixed;inset:auto 50% 26px auto;transform:translateX(50%) translateY(120px);opacity:0;pointer-events:none;
      background:rgba(8,10,22,.88);border:1px solid rgba(64,245,255,.25);padding:18px 24px;border-radius:20px;box-shadow:0 0 30px rgba(64,245,255,.24),0 0 70px rgba(255,79,216,.12);backdrop-filter:blur(12px)
    }
    .result.show{animation:pop .8s cubic-bezier(.18,.89,.22,1.2) forwards}
    @keyframes pop{0%{opacity:0;transform:translateX(50%) translateY(120px) scale(.78)}60%{opacity:1;transform:translateX(50%) translateY(0) scale(1.08)}100%{opacity:1;transform:translateX(50%) translateY(0) scale(1)}}
    .result .title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em}
    .result .win{font-size:30px;font-weight:900;margin-top:6px;text-shadow:0 0 16px rgba(64,245,255,.7),0 0 24px rgba(255,79,216,.35)}
    .overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .confetti{position:absolute;width:7px;height:12px;border-radius:2px;opacity:.95;animation:conf 2.8s linear forwards;box-shadow:0 0 10px currentColor}
    @keyframes conf{0%{transform:translate3d(var(--x),110vh,0) rotate(0deg)}100%{transform:translate3d(calc(var(--x) + var(--dx)), -20vh, 0) rotate(720deg)}}
    .topactions{display:flex;gap:10px;flex-wrap:wrap}
    .sr{position:absolute;left:-9999px}
    .note{font-size:12px;color:var(--muted);line-height:1.5}
    .tabs{display:flex;gap:10px;flex-wrap:wrap}
    .tab{padding:10px 14px;border-radius:14px;font-size:12px}
    .tab.active{border-color:rgba(184,255,79,.55);box-shadow:0 0 16px rgba(184,255,79,.14)}
    @media (max-width:1200px){
      html,body{overflow:auto}
      .app{grid-template-columns:1fr;padding:12px;min-height:100%;height:auto}
      .center{order:-1}
      .wheelwrap{width:min(88vw, 680px)}
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="result" id="result"><div class="title" id="resultTitle">Result</div><div class="win" id="resultWin">—</div></div>
  <div class="app">
    <div class="left panel">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab active" data-tab="editor">SpinLux</button>
          <button class="tab" data-tab="mywheels">Mes Roues</button>
        </div>
        <div class="lang">
          <button title="Français" data-lang="fr">🇫🇷</button>
          <button title="Español" data-lang="es">🇪🇸</button>
          <button title="English" data-lang="en">🇬🇧</button>
        </div>
      </div>
      <div class="brand">
        <h1>SpinLux</h1>
        <p id="subtitle">Roue néon premium, ultra fluide, immersive et futuriste.</p>
      </div>
      <div class="chiprow">
        <div class="chip" id="chip1">60 FPS Canvas</div>
        <div class="chip" id="chip2">Anti-Gravity FX</div>
        <div class="chip" id="chip3">FR / ES / EN</div>
      </div>

      <div class="section">
        <h2 id="wheelConfigTitle">Configuration</h2>
        <div class="col">
          <div class="row">
            <div class="col" style="flex:1">
              <label id="sectionsLabel">Sections</label>
              <input id="count" type="range" min="2" max="50" value="8" />
            </div>
            <div class="col" style="width:90px">
              <label>&nbsp;</label>
              <input id="countNum" type="number" min="2" max="50" value="8" />
            </div>
          </div>
          <div class="topactions">
            <button class="smallbtn" id="templateYesNo">Oui / Non</button>
            <button class="smallbtn" id="template1to10">1 → 10</button>
            <button class="smallbtn" id="templateColors">Couleurs</button>
            <button class="smallbtn" id="addWheel">+ Nouvelle roue</button>
          </div>
          <div class="toggle"><div class="switch on" id="soundSwitch"></div><span id="soundLabel">Son futuriste</span></div>
          <div class="toggle"><div class="switch" id="weightSwitch"></div><span id="weightLabel">Poids avancés</span></div>
          <div class="toggle"><div class="switch" id="fullSwitch"></div><span id="fullLabel">Plein écran</span></div>
        </div>
      </div>

      <div class="section">
        <h2 id="sectionsTitle">Sections</h2>
        <div class="sectionlist" id="sections"></div>
      </div>
    </div>

    <div class="center panel">
      <div class="wheelwrap">
        <div class="halo"></div>
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <div class="centercap"></div>
        <div class="floating" id="floating"></div>
      </div>
      <button class="btn spin" id="spinBtn">LANCER LA ROUE</button>
      <div class="note" id="hint">Clique sur la roue ou sur le bouton pour lancer.</div>
    </div>

    <div class="right panel">
      <div class="section">
        <h2 id="saveTitle">Sauvegarde</h2>
        <div class="row">
          <button class="btn primary" id="saveBtn" style="flex:1">Sauver</button>
          <button class="btn" id="exportBtn">Export</button>
        </div>
        <div class="row">
          <button class="btn" id="importBtn">Import</button>
          <button class="btn" id="shareBtn">Lien</button>
        </div>
        <input class="sr" type="file" id="fileInput" accept="application/json" />
        <textarea id="shareBox" placeholder="Lien partagé / JSON..."></textarea>
      </div>

      <div class="section">
        <h2 id="historyTitle">Historique</h2>
        <div class="history" id="history"></div>
      </div>

      <div class="section">
        <h2 id="wheelTitle">Mes Roues</h2>
        <div class="history" id="wheels"></div>
      </div>
    </div>
  </div>

<script>
const I18N = {
  fr:{subtitle:"Roue néon premium, ultra fluide, immersive et futuriste.",config:"Configuration",sections:"Sections",spin:"LANCER LA ROUE",hint:"Clique sur la roue ou sur le bouton pour lancer.",save:"Sauvegarde",history:"Historique",mywheels:"Mes Roues",sound:"Son futuriste",weights:"Poids avancés",fullscreen:"Plein écran",savebtn:"Sauver",export:"Export",import:"Import",link:"Lien",result:"Résultat",newwheel:"+ Nouvelle roue",yesno:"Oui / Non",oneToTen:"1 → 10",colors:"Couleurs",sharePlaceholder:"Lien partagé / JSON...",wheel:"Roue",delete:"Supprimer",duplicate:"Dupliquer",load:"Charger"},
  es:{subtitle:"Ruleta neón premium, ultra fluida, inmersiva y futurista.",config:"Configuración",sections:"Secciones",spin:"GIRAR LA RUEDA",hint:"Haz clic en la rueda o en el botón para girar.",save:"Guardado",history:"Historial",mywheels:"Mis Ruletas",sound:"Sonido futurista",weights:"Pesos avanzados",fullscreen:"Pantalla completa",savebtn:"Guardar",export:"Exportar",import:"Importar",link:"Enlace",result:"Resultado",newwheel:"+ Nueva ruleta",yesno:"Sí / No",oneToTen:"1 → 10",colors:"Colores",sharePlaceholder:"Enlace compartido / JSON...",wheel:"Ruleta",delete:"Eliminar",duplicate:"Duplicar",load:"Cargar"},
  en:{subtitle:"Premium neon wheel, ultra-smooth, immersive and futuristic.",config:"Configuration",sections:"Sections",spin:"SPIN THE WHEEL",hint:"Click the wheel or the button to spin.",save:"Storage",history:"History",mywheels:"My Wheels",sound:"Futuristic sound",weights:"Advanced weights",fullscreen:"Fullscreen",savebtn:"Save",export:"Export",import:"Import",link:"Link",result:"Result",newwheel:"+ New wheel",yesno:"Yes / No",oneToTen:"1 → 10",colors:"Colors",sharePlaceholder:"Shared link / JSON...",wheel:"Wheel",delete:"Delete",duplicate:"Duplicate",load:"Load"}
};
const neonPalette=["#40f5ff","#ff4fd8","#9e6bff","#b8ff4f","#ffd56b","#ff6b8b","#39ff88","#00d4ff","#f7a6ff","#7cfffb","#f0ff5d","#ff8c42"];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={lang:"fr",sound:true,weights:false,fullscreen:false,activeWheel:0,history:[],wheels:[{name:"SpinLux 1",items:[{t:"✨ Gagne",c:"#40f5ff",w:1},{t:"💎 Perds",c:"#ff4fd8",w:1},{t:"🚀 Rejoue",c:"#9e6bff",w:1},{t:"🔥 Jackpot",c:"#b8ff4f",w:1},{t:"🌌 Bonus",c:"#ffd56b",w:1},{t:"⚡ Power",c:"#ff6b8b",w:1},{t:"🪐 Cosmic",c:"#39ff88",w:1},{t:"🎁 Mystery",c:"#00d4ff",w:1}]}],spin:{rot:0,vel:0,spinning:false,target:0},audio:null};
function t(k){return I18N[state.lang][k]||k}
function save(){localStorage.setItem("spinlux",JSON.stringify({lang:state.lang,sound:state.sound,weights:state.weights,activeWheel:state.activeWheel,history:state.history,wheels:state.wheels}))}
function load(){try{const d=JSON.parse(localStorage.getItem("spinlux")||"null");if(d)Object.assign(state,d)}catch(e){}}
function applyI18n(){
  $("#subtitle").textContent=t("subtitle");$("#wheelConfigTitle").textContent=t("config");$("#sectionsTitle").textContent=t("sections");
  $("#spinBtn").textContent=t("spin");$("#hint").textContent=t("hint");$("#saveTitle").textContent=t("save");$("#historyTitle").textContent=t("history");
  $("#wheelTitle").textContent=t("mywheels");$("#soundLabel").textContent=t("sound");$("#weightLabel").textContent=t("weights");$("#fullLabel").textContent=t("fullscreen");
  $("#saveBtn").textContent=t("savebtn");$("#exportBtn").textContent=t("export");$("#importBtn").textContent=t("import");$("#shareBtn").textContent=t("link");
  $("#count").title=t("sections");$("#countNum").title=t("sections");$("#shareBox").placeholder=t("sharePlaceholder");
  $("#templateYesNo").textContent=t("yesno");$("#template1to10").textContent=t("oneToTen");$("#templateColors").textContent=t("colors");$("#addWheel").textContent=t("newwheel");
  $$(".tab")[1].textContent=t("mywheels");$("#resultTitle").textContent=t("result");
  $$("[data-lang]").forEach(b=>b.classList.toggle("active", b.dataset.lang===state.lang));
}
function currentWheel(){return state.wheels[state.activeWheel]}
function ensureCount(n){
  const wheel=currentWheel(); while(wheel.items.length<n) wheel.items.push({t:"Item "+(wheel.items.length+1),c:neonPalette[wheel.items.length%neonPalette.length],w:1});
  while(wheel.items.length>n) wheel.items.pop(); renderSections(); save(); draw();
}
function renderSections(){
  $("#count").value=$("#countNum").value=currentWheel().items.length;
  const wrap=$("#sections"); wrap.innerHTML="";
  currentWheel().items.forEach((it,i)=>{
    const el=document.createElement("div"); el.className="card"; el.draggable=true; el.dataset.i=i;
    el.innerHTML=`<div class="cardhead"><div><span class="handle">⠿</span> <b>#${i+1}</b></div><div class="mini">
      <button class="smallbtn up">↑</button><button class="smallbtn down">↓</button><button class="smallbtn del">${t("delete")}</button></div></div>
      <div class="col"><input type="text" value="${escapeHtml(it.t)}" class="txt" placeholder="Label"/><div class="row"><input type="color" class="swatch" value="${it.c}"/><input type="number" class="weight" min="0" step="0.1" value="${it.w}" style="width:90px;display:${state.weights?'block':'none'}"></div></div>`;
    wrap.appendChild(el);
    const [txt,swatch,weight]=[el.querySelector(".txt"),el.querySelector(".swatch"),el.querySelector(".weight")];
    txt.oninput=()=>{it.t=txt.value;save();draw()};
    swatch.oninput=()=>{it.c=swatch.value;save();draw()};
    weight.oninput=()=>{it.w=Math.max(0,parseFloat(weight.value)||0);save();draw()};
    el.querySelector(".del").onclick=()=>{currentWheel().items.splice(i,1);ensureCount(Math.max(2,currentWheel().items.length));};
    el.querySelector(".up").onclick=()=>swap(i,i-1);
    el.querySelector(".down").onclick=()=>swap(i,i+1);
    el.ondragstart=e=>{e.dataTransfer.setData("text/plain",i)};
    el.ondrop=e=>{e.preventDefault(); swap(+e.dataTransfer.getData("text/plain"), i)};
    el.ondragover=e=>e.preventDefault();
  });
  renderWheels(); renderHistory();
}
function swap(a,b){const arr=currentWheel().items;if(a<0||b<0||a>=arr.length||b>=arr.length)return; [arr[a],arr[b]]=[arr[b],arr[a]]; renderSections(); save(); draw();}
function renderWheels(){
  const w=$("#wheels"); w.innerHTML="";
  state.wheels.forEach((wheel,i)=>{
    const d=document.createElement("div"); d.className="item";
    d.innerHTML=`<div><b>${escapeHtml(wheel.name)}</b><div><span>${wheel.items.length} ${t("sections")}</span></div></div><div class="mini"><button class="smallbtn">${t("load")}</button><button class="smallbtn">${t("duplicate")}</button></div>`;
    d.querySelectorAll("button")[0].onclick=()=>{state.activeWheel=i; renderSections(); draw(); save()};
    d.querySelectorAll("button")[1].onclick=()=>{state.wheels.splice(i+1,0,JSON.parse(JSON.stringify(wheel))); renderWheels(); save()};
    w.appendChild(d);
  });
}
function renderHistory(){
  const h=$("#history"); h.innerHTML="";
  state.history.slice(0,10).forEach((r,idx)=>{
    const d=document.createElement("div"); d.className="item";
    d.innerHTML=`<div><b>${escapeHtml(r.text)}</b><div><span>${new Date(r.at).toLocaleTimeString()}</span></div></div><button class="smallbtn">${idx===0?"↺":"⟳"}</button>`;
    d.querySelector("button").onclick=()=>{if(r.index!=null){spinToIndex(r.index)}};
    h.appendChild(d);
  });
}
function setLang(l){state.lang=l; applyI18n(); renderSections(); save()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&gt;","<":"&quot;","'":"&#39;","<":"&lt;"}[m]))}
function weightedIndex(items){
  const arr=state.weights?items.map(x=>Math.max(0.001, +x.w||0.001)):items.map(()=>1);
  const total=arr.reduce((a,b)=>a+b,0), r=Math.random()*total; let c=0;
  for(let i=0;i<arr.length;i++){c+=arr[i]; if(r<=c) return i}
  return items.length-1;
}
const canvas=$("#wheel"), ctx=canvas.getContext("2d",{alpha:true});
let W=0,H=0,DPR=1,resizeTimer=0;
function resize(){
  const rect=canvas.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*DPR); canvas.height=Math.round(rect.height*DPR); W=canvas.width; H=canvas.height;
  ctx.setTransform(DPR,0,0,DPR,0,0); draw();
}
window.addEventListener("resize",()=>{clearTimeout(resizeTimer); resizeTimer=setTimeout(resize,50)});
function draw(){
  const rect=canvas.getBoundingClientRect(), w=rect.width, h=rect.height, cx=w/2, cy=h/2, R=Math.min(w,h)*.46;
  ctx.clearRect(0,0,w,h);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(state.spin.rot);
  const items=currentWheel().items, n=items.length, aStep=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const a0=i*aStep, a1=a0+aStep, it=items[i];
    const g=ctx.createRadialGradient(0,0,R*.12,0,0,R);
    g.addColorStop(0,shade(it.c,.75)); g.addColorStop(.72,it.c); g.addColorStop(1,shade(it.c,-.28));
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.shadowColor=it.c; ctx.shadowBlur=18;
    ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=2; ctx.stroke(); ctx.shadowBlur=0;
    ctx.save(); ctx.rotate(a0+aStep/2); ctx.translate(R*.66,0); ctx.rotate(Math.PI/2);
    ctx.fillStyle="rgba(255,255,255,.95)"; ctx.font=`700 ${Math.max(12,R*.07)}px Inter, sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.shadowColor=it.c; ctx.shadowBlur=14; wrapText(ctx,it.t,0,0,R*.42); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0,0,R*.98,0,Math.PI*2); ctx.strokeStyle="rgba(64,245,255,.85)"; ctx.lineWidth=5; ctx.shadowColor="#40f5ff"; ctx.shadowBlur=22; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R*.88,0,Math.PI*2); ctx.strokeStyle="rgba(255,79,216,.55)"; ctx.lineWidth=2; ctx.setLineDash([10,12]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  if(!state.spin.spinning){ ctx.save(); ctx.fillStyle="rgba(255,255,255,.08)"; ctx.font="700 14px Inter"; ctx.textAlign="center"; ctx.fillText("SPINLUX", cx, cy+6); ctx.restore(); }
}
function shade(hex,amt){let c=hex.replace('#','');let n=parseInt(c,16),r=(n>>16)+Math.round(255*amt),g=((n>>8)&255)+Math.round(255*amt),b=(n&255)+Math.round(255*amt); return `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`}
function wrapText(ctx,text,x,y,max){const words=String(text).split(' '); let line="", lines=[]; for(const w of words){const test=line+(line?' ':'')+w; if(ctx.measureText(test).width>max && line) {lines.push(line); line=w;} else line=test;} lines.push(line); lines.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,x,y+i*18))}
function spinToIndex(index){
  const items=currentWheel().items, n=items.length, step=360/n, targetAngle=(360 - (index*step + step/2)) % 360;
  startSpin(index, targetAngle);
}
function startSpin(forcedIndex=null, targetAngle=null){
  if(state.spin.spinning) return;
  if(!state.audio) initAudio();
  if(state.sound) beep("start");
  const items=currentWheel().items, n=items.length, idx=forcedIndex??weightedIndex(items);
  const anglePer=360/n, desired=targetAngle ?? ((360 - (idx*anglePer + anglePer/2)) % 360);
  const current=(state.spin.rot*180/Math.PI)%360;
  const delta=(desired-current+360)%360 + 360*7 + Math.random()*360;
  state.spin.start=performance.now(); state.spin.dur=5200+Math.random()*900; state.spin.spinning=true;
  state.spin.from=state.spin.rot; state.spin.to=state.spin.rot + delta*Math.PI/180; state.spin.idx=idx;
  requestAnimationFrame(animateSpin);
}
function animateSpin(t){
  const p=Math.min(1,(t-state.spin.start)/state.spin.dur);
  const ease=1-Math.pow(1-p,4);
  const float=Math.sin(p*Math.PI*4)*0.018*Math.pow(1-p,1.5);
  state.spin.rot=state.spin.from+(state.spin.to-state.spin.from)*ease + float;
  draw();
  if(p<1){ requestAnimationFrame(animateSpin); return; }
  state.spin.spinning=false; state.spin.rot=state.spin.to; draw(); onResult(state.spin.idx);
}
function onResult(idx){
  const item=currentWheel().items[idx];
  state.history.unshift({text:item.t,index:idx,at:Date.now()}); state.history=state.history.slice(0,10); save(); renderHistory();
  $("#resultWin").textContent=item.t; $("#result").classList.remove("show"); void $("#result").offsetWidth; $("#result").classList.add("show");
  burstConfetti(item.c); if(state.sound) beep("win");
}
function burstConfetti(color){
  const ov=$("#overlay"); for(let i=0;i<48;i++){ const s=document.createElement("div"); s.className="confetti"; s.style.color=color;
    s.style.background=`linear-gradient(180deg, ${color}, white)`; s.style.setProperty("--x", (Math.random()*100).toFixed(2)+"vw"); s.style.setProperty("--dx", ((Math.random()*2-1)*30).toFixed(2)+"vw");
    s.style.left="0"; s.style.top="0"; s.style.animationDelay=(Math.random()*0.2)+"s"; ov.appendChild(s); setTimeout(()=>s.remove(),3000);}
}
function initAudio(){try{const A=window.AudioContext||window.webkitAudioContext; state.audio=new A();}catch(e){}}
function beep(mode){
  if(!state.audio) return;
  if(state.audio.state==="suspended") state.audio.resume().catch(()=>{});
  const now=state.audio.currentTime, o=state.audio.createOscillator(), g=state.audio.createGain(), f=state.audio.createBiquadFilter();
  o.type=mode==="win"?"triangle":"sawtooth"; o.frequency.setValueAtTime(mode==="win"?880:120, now); o.frequency.exponentialRampToValueAtTime(mode==="win"?1320:240, now+0.18);
  f.type="lowpass"; f.frequency.setValueAtTime(2400, now);
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(mode==="win"?0.12:0.05, now+0.04); g.gain.exponentialRampToValueAtTime(0.0001, now+0.28);
  o.connect(f); f.connect(g); g.connect(state.audio.destination); o.start(now); o.stop(now+0.3);
}
function shareData(){
  const data=btoa(unescape(encodeURIComponent(JSON.stringify({lang:state.lang,sound:state.sound,weights:state.weights,wheels:state.wheels,activeWheel:state.activeWheel}))));
  const url=location.origin+location.pathname+"#"+data; $("#shareBox").value=url; navigator.clipboard?.writeText(url).catch(()=>{});
}
function importShare(str){
  try{
    let raw=str.trim();
    if(raw.startsWith("http")) raw=raw.split("#")[1]||"";
    if(raw.startsWith("{")) raw=raw;
    else raw=decodeURIComponent(escape(atob(raw)));
    const d=JSON.parse(raw);
    if(d.wheels) state.wheels=d.wheels;
    if(d.lang) state.lang=d.lang;
    state.sound=!!d.sound; state.weights=!!d.weights; state.activeWheel=Math.min(d.activeWheel||0, state.wheels.length-1);
    applyI18n(); renderSections(); draw(); save();
  }catch(e){alert("Import invalide");}
}
function templates(type){
  const wheel=currentWheel();
  if(type==="yesno") wheel.items=[{t:"Oui",c:"#40f5ff",w:1},{t:"Non",c:"#ff4fd8",w:1}];
  if(type==="1to10") wheel.items=Array.from({length:10},(_,i)=>({t:String(i+1),c:neonPalette[i%neonPalette.length],w:1}));
  if(type==="colors") wheel.items=neonPalette.slice(0,8).map((c,i)=>({t:["Cyan","Magenta","Violet","Acid","Gold","Rose","Green","Blue"][i],c,w:1}));
  renderSections(); save(); draw();
}
function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
$("#count").oninput=e=>{ $("#countNum").value=e.target.value; ensureCount(+e.target.value); };
$("#countNum").oninput=e=>{ $("#count").value=e.target.value; ensureCount(+e.target.value); };
$("#spinBtn").onclick=()=>startSpin();
canvas.onclick=()=>startSpin();
$("#saveBtn").onclick=()=>save();
$("#exportBtn").onclick=()=>{ const blob=new Blob([JSON.stringify(state)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="spinlux.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); };
$("#importBtn").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importShare(r.result); r.readAsText(f)};
$("#shareBtn").onclick=shareData;
$("#shareBox").addEventListener("dblclick",()=>importShare($("#shareBox").value));
$("#soundSwitch").onclick=()=>{state.sound=!state.sound; $("#soundSwitch").classList.toggle("on",state.sound); save(); if(state.sound) initAudio()};
$("#weightSwitch").onclick=()=>{state.weights=!state.weights; $("#weightSwitch").classList.toggle("on",state.weights); renderSections(); save()};
$("#fullSwitch").onclick=()=>{toggleFull()};
$("#templateYesNo").onclick=()=>templates("yesno");
$("#template1to10").onclick=()=>templates("1to10");
$("#templateColors").onclick=()=>templates("colors");
$("#addWheel").onclick=()=>{state.wheels.push({name:"SpinLux "+(state.wheels.length+1),items:JSON.parse(JSON.stringify(currentWheel().items))}); state.activeWheel=state.wheels.length-1; renderSections(); save();};
$$("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$$(".tab").forEach(b=>b.onclick=()=>{$$(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active")});
function initParticles(){
  const f=$("#floating"); f.innerHTML="";
  for(let i=0;i<22;i++){ const p=document.createElement("div"); p.className="particle";
    p.style.left=(Math.random()*100).toFixed(2)+"%"; p.style.top=(Math.random()*100).toFixed(2)+"%";
    p.style.color=neonPalette[i%neonPalette.length]; p.style.setProperty("--x",(Math.random()*100).toFixed(2)+"%");
    p.style.setProperty("--dx",((Math.random()*2-1)*20).toFixed(2)+"%");
    p.style.setProperty("--dur",(8+Math.random()*12).toFixed(1)+"s"); f.appendChild(p);
  }
}
load(); initParticles(); applyI18n(); renderSections(); resize(); draw();
$("#soundSwitch").classList.toggle("on",state.sound); $("#weightSwitch").classList.toggle("on",state.weights);
if(location.hash.length>1) importShare(location.hash.slice(1));
save();
</script>
