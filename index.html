<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SpinLux | Decision Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        orbitron: ['Orbitron','sans-serif'],
        rajdhani: ['Rajdhani','sans-serif']
      },
      colors: { dark: '#030308', panel: 'rgba(10,10,20,0.65)' }
    }
  }
}
</script>
<style>
:root {
  --neon-cyan:    #00f3ff;
  --neon-magenta: #ff00ff;
  --neon-purple:  #b026ff;
  --neon-green:   #39ff14;
  --neon-gold:    #ffd700;
  --bg-color:     #030308;
  --wheel-size:   480px;
}
@media(max-width:768px){ :root { --wheel-size: 300px; } }
@media(max-width:400px){ :root { --wheel-size: 260px; } }

*,*::before,*::after { box-sizing: border-box; }
body {
  background-color: var(--bg-color);
  background-image: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #030308 100%);
  color: white;
  font-family: 'Rajdhani', sans-serif;
  overflow-x: hidden;
  overscroll-behavior: none;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
::-webkit-scrollbar-thumb { background: rgba(0,243,255,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,243,255,0.7); }

/* ── Animations ── */
.anti-gravity        { animation: float  6s ease-in-out infinite; will-change: transform; }
.anti-gravity-slow   { animation: float  8s ease-in-out infinite 1s; will-change: transform; }
.anti-gravity-fast   { animation: float-s 4s ease-in-out infinite; will-change: transform; }
@keyframes float   { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-14px) rotate(.8deg)} }
@keyframes float-s { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

/* ── Glass panel ── */
.glass-panel {
  background: rgba(10,10,20,0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  border-radius: 16px;
  transition: border-color .3s, box-shadow .3s;
}
.glass-panel:hover { border-color: rgba(0,243,255,0.2); box-shadow: 0 8px 32px rgba(0,243,255,0.08); }

/* ── Neon helpers ── */
.neon-cyan    { text-shadow: 0 0 6px var(--neon-cyan), 0 0 14px var(--neon-cyan); color:#fff; }
.neon-gold    { text-shadow: 0 0 6px var(--neon-gold), 0 0 16px var(--neon-gold), 0 0 36px var(--neon-gold); color:#fff; }
.neon-magenta { text-shadow: 0 0 6px var(--neon-magenta), 0 0 14px var(--neon-magenta); color:#fff; }

/* ── Wheel ── */
#wheel-wrap {
  width: var(--wheel-size);
  height: var(--wheel-size);
  position: relative;
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(0,243,255,.18), inset 0 0 40px rgba(255,0,255,.15), 0 0 90px rgba(0,243,255,.08);
  border: 3px solid rgba(255,255,255,0.08);
  cursor: pointer;
  z-index: 10;
}
#wheel-canvas { width:100%; height:100%; border-radius:50%; will-change:transform; display:block; }
.wheel-pointer {
  position:absolute; top:-18px; left:50%; transform:translateX(-50%); z-index:20;
  filter: drop-shadow(0 0 12px var(--neon-cyan));
}
.wheel-pointer::after {
  content:''; display:block;
  width:0; height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:36px solid #fff;
}

/* ── Buttons ── */
.neon-btn {
  background: transparent;
  color: white;
  border: 1px solid var(--neon-magenta);
  box-shadow: 0 0 8px rgba(255,0,255,.18), inset 0 0 8px rgba(255,0,255,.12);
  text-transform: uppercase;
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 2px;
  transition: all .28s cubic-bezier(.25,.8,.25,1);
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.neon-btn::before {
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
  transition: left .45s ease;
}
.neon-btn:hover { background:rgba(255,0,255,.08); box-shadow:0 0 18px var(--neon-magenta),inset 0 0 12px rgba(255,0,255,.3); transform:translateY(-2px) scale(1.03); }
.neon-btn:hover::before { left:100%; }
.neon-btn:active { transform:scale(.96); }

.neon-btn-cyan {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 8px rgba(0,243,255,.18), inset 0 0 8px rgba(0,243,255,.12);
}
.neon-btn-cyan:hover { background:rgba(0,243,255,.08); box-shadow:0 0 18px var(--neon-cyan),inset 0 0 12px rgba(0,243,255,.3); }

/* ── Inputs ── */
input[type="text"],input[type="number"],input[type="range"],select {
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.1);
  color: white;
  transition: all .25s ease;
}
input[type="text"]:focus,input[type="number"]:focus,select:focus {
  outline:none; border-color:var(--neon-cyan); box-shadow:0 0 8px rgba(0,243,255,.3);
}
input[type="number"] { -moz-appearance:textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
select option { background:#0a0a1a; }
input[type="range"] { -webkit-appearance:none; appearance:none; background:rgba(255,255,255,.1); border:none; height:4px; border-radius:2px; cursor:pointer; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; background:var(--neon-cyan); border-radius:50%; box-shadow:0 0 6px var(--neon-cyan); }

/* ── Segment list items ── */
.seg-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 10px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.06);
  border-radius:8px;
  transition: all .18s ease;
  cursor:default;
}
.seg-item:hover { background:rgba(255,255,255,.04); border-color:rgba(0,243,255,.2); }
.seg-item.dragging { opacity:.4; border:1.5px dashed var(--neon-cyan); }

/* ── Tabs ── */
.tab-btn { border-bottom:2px solid transparent; transition:all .25s ease; opacity:.55; }
.tab-btn:hover { opacity:.85; }
.tab-btn.active { opacity:1; border-bottom-color:var(--neon-cyan); color:var(--neon-cyan); text-shadow:0 0 8px rgba(0,243,255,.5); }

/* ── Modal ── */
#result-modal {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(3,3,8,.82); backdrop-filter:blur(18px);
  opacity:0; pointer-events:none; transition:opacity .35s; z-index:200;
}
#result-modal.active { opacity:1; pointer-events:all; }
.result-content {
  transform:scale(.8) translateY(40px);
  transition:transform .55s cubic-bezier(.175,.885,.32,1.275);
}
#result-modal.active .result-content { transform:scale(1) translateY(0); }

/* ── Stats bar ── */
.stat-bar-fill {
  height:100%; background:linear-gradient(90deg,var(--c1,var(--neon-cyan)),var(--c2,var(--neon-magenta)));
  border-radius:3px;
  box-shadow:0 0 6px var(--c1,var(--neon-cyan));
  transition:width .6s ease;
}

/* ── Backgrounds ── */
#bg-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; }
#conf-canvas { position:fixed; inset:0; pointer-events:none; z-index:190; }

/* ── Flags ── */
.lang-flag {
  cursor:pointer; filter:grayscale(1) opacity(.45); transition:all .25s ease; font-size:1.4rem; line-height:1;
}
.lang-flag:hover { filter:grayscale(0) opacity(1); transform:scale(1.15); }
.lang-flag.active { filter:grayscale(0) opacity(1) drop-shadow(0 0 8px var(--neon-cyan)); }

/* ── Preset cards ── */
.preset-card {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px; border-radius:10px;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.06);
  cursor:pointer; transition:all .2s ease;
}
.preset-card:hover { background:rgba(0,243,255,.06); border-color:rgba(0,243,255,.3); }

/* ── Weight toggle ── */
.weight-badge {
  font-size:11px; padding:2px 7px; border-radius:20px;
  background:rgba(176,38,255,.2); border:1px solid rgba(176,38,255,.4);
  color:rgba(176,38,255,.9); font-family:'Orbitron',sans-serif;
  transition: all .25s;
}

/* ── Responsive layout ── */
@media(max-width:768px) {
  .right-panel { order: 2; width: 100%; }
  .left-panel  { order: 1; }
}

/* ── Toast ── */
#toast {
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px);
  background:rgba(10,10,20,.9); border:1px solid rgba(255,255,255,.15);
  color:#fff; padding:10px 24px; border-radius:40px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:300;
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px;
  white-space:nowrap;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body class="antialiased">

<canvas id="bg-canvas"></canvas>
<canvas id="conf-canvas"></canvas>

<!-- ═══ HEADER ═══ -->
<header class="relative z-50 flex justify-between items-center px-5 py-4 glass-panel rounded-none border-t-0 border-l-0 border-r-0">
  <div class="flex items-center gap-4">
    <div class="font-orbitron font-black text-2xl tracking-widest anti-gravity-fast cursor-pointer select-none" onclick="location.reload()">
      <span class="neon-cyan">SPIN</span><span class="text-white">LUX</span>
    </div>
  </div>

  <!-- Wheel title (center on desktop) -->
  <input id="wheel-title" type="text" maxlength="40"
    class="hidden md:block text-center font-orbitron text-sm tracking-widest rounded-lg px-4 py-2 w-56 bg-transparent border border-transparent hover:border-white/10 focus:border-cyan-400/50 transition-all"
    value="Ma Roue" style="color:rgba(255,255,255,.7)">

  <div class="flex items-center gap-4">
    <!-- Audio -->
    <button id="btn-audio" title="Son" class="text-gray-400 hover:text-white transition-colors text-lg">
      <i class="fas fa-volume-up"></i>
    </button>
    <!-- Fullscreen -->
    <button id="btn-fs" title="Plein écran" class="hidden md:block text-gray-400 hover:text-white transition-colors text-lg">
      <i class="fas fa-expand"></i>
    </button>
    <!-- Lang -->
    <div class="flex items-center gap-2">
      <span class="lang-flag active" data-lang="fr">🇫🇷</span>
      <span class="lang-flag" data-lang="en">🇬🇧</span>
      <span class="lang-flag" data-lang="es">🇪🇸</span>
    </div>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<main class="flex flex-col lg:flex-row gap-6 p-4 md:p-6 relative z-10 max-w-screen-2xl mx-auto w-full">

  <!-- ─── LEFT PANEL ─── -->
  <aside class="left-panel w-full lg:w-[400px] flex flex-col gap-4 anti-gravity-slow">

    <!-- Options editor -->
    <div class="glass-panel p-5 flex flex-col gap-4">
      <!-- Tab bar -->
      <div class="flex border-b border-white/10 font-orbitron text-xs">
        <button class="tab-btn active flex-1 pb-2" data-tab="options"><i class="fas fa-list mr-1"></i><span data-i18n="tab_options">OPTIONS</span></button>
        <button class="tab-btn flex-1 pb-2" data-tab="presets"><i class="fas fa-magic mr-1"></i><span data-i18n="tab_presets">MODÈLES</span></button>
        <button class="tab-btn flex-1 pb-2" data-tab="settings"><i class="fas fa-cog mr-1"></i><span data-i18n="tab_settings">RÉGLAGES</span></button>
      </div>

      <!-- ── OPTIONS TAB ── -->
      <div id="tab-options" class="tab-content flex flex-col gap-3">
        <!-- Toolbar -->
        <div class="flex items-center justify-between">
          <span id="seg-count" class="text-xs text-gray-400 font-orbitron">0/50</span>
          <div class="flex gap-2">
            <!-- Weight toggle -->
            <button id="btn-weights" class="weight-badge" data-i18n="weights_off">POIDS OFF</button>
            <!-- Shuffle -->
            <button id="btn-shuffle" title="Mélanger" class="text-xs neon-btn px-3 py-1 rounded-lg"><i class="fas fa-random"></i></button>
            <!-- Clear all -->
            <button id="btn-clear" title="Vider" class="text-xs border border-red-500/60 text-red-400 hover:bg-red-500/20 px-3 py-1 rounded-lg transition-colors"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <!-- Segment list -->
        <div id="seg-list" class="flex flex-col gap-2 overflow-y-auto max-h-52 pr-1"></div>

        <!-- Add form -->
        <form id="add-form" class="flex gap-2 pt-3 border-t border-white/08">
          <input type="color" id="add-color" class="w-9 h-9 rounded-lg cursor-pointer bg-transparent border border-white/10 p-0.5 flex-shrink-0">
          <input type="text" id="add-text" class="flex-grow rounded-lg px-3 py-2 text-sm" data-i18n-ph="ph_add" placeholder="Nouvelle option…" required autocomplete="off">
          <div id="add-weight-wrap" class="hidden">
            <input type="number" id="add-weight" min="1" max="100" value="1" class="w-14 rounded-lg px-2 py-2 text-sm text-center">
          </div>
          <button type="submit" class="neon-btn neon-btn-cyan px-4 rounded-lg text-sm"><i class="fas fa-plus"></i></button>
        </form>
      </div>

      <!-- ── PRESETS TAB ── -->
      <div id="tab-presets" class="tab-content hidden flex-col gap-2 overflow-y-auto max-h-80 pr-1">
        <p class="text-xs text-gray-400 mb-1" data-i18n="presets_desc">Remplacer la roue par un modèle prédéfini.</p>
        <div id="presets-list" class="flex flex-col gap-2"></div>
      </div>

      <!-- ── SETTINGS TAB ── -->
      <div id="tab-settings" class="tab-content hidden flex-col gap-5">
        <!-- Spin duration -->
        <div>
          <label class="text-xs text-gray-400 uppercase tracking-widest font-orbitron block mb-2" data-i18n="lbl_duration">Durée du spin</label>
          <div class="flex items-center gap-3">
            <input type="range" id="spin-duration" min="2" max="12" step="1" value="6" class="flex-1">
            <span id="spin-duration-val" class="text-cyan-400 font-orbitron text-sm w-12 text-right">6s</span>
          </div>
          <div class="flex justify-between text-xs text-gray-600 mt-1">
            <span data-i18n="dur_fast">Rapide</span><span data-i18n="dur_dramatic">Dramatique</span>
          </div>
        </div>
        <!-- Mode: remove winner -->
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-300" data-i18n="lbl_remove">Supprimer le gagnant</span>
          <button id="btn-remove-winner" class="w-11 h-6 rounded-full border border-white/20 relative transition-colors bg-white/10" aria-pressed="false">
            <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full transition-transform shadow"></span>
          </button>
        </div>
        <!-- Share -->
        <button id="btn-share" class="neon-btn neon-btn-cyan px-4 py-2 rounded-lg text-sm w-full">
          <i class="fas fa-share-alt mr-2"></i><span data-i18n="btn_share">PARTAGER LA ROUE</span>
        </button>
        <!-- Reset stats -->
        <button id="btn-reset-stats" class="border border-red-500/50 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-lg text-sm w-full transition-colors font-orbitron">
          <i class="fas fa-chart-bar mr-2"></i><span data-i18n="btn_reset_stats">RÉINITIALISER STATS</span>
        </button>
      </div>
    </div>

    <!-- History -->
    <div class="glass-panel p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="font-orbitron text-xs tracking-widest text-cyan-400" data-i18n="lbl_history">HISTORIQUE</span>
        <button id="btn-clear-history" class="text-xs text-red-400 hover:text-red-300 transition-colors"><i class="fas fa-trash"></i></button>
      </div>
      <ul id="history-list" class="flex flex-col gap-2 max-h-36 overflow-y-auto pr-1">
        <li class="text-gray-500 text-sm italic text-center py-3" data-i18n="history_empty">Aucun résultat</li>
      </ul>
    </div>

  </aside>

  <!-- ─── CENTER: WHEEL ─── -->
  <section class="flex-1 flex flex-col items-center justify-center gap-6 py-4 relative">
    <div class="anti-gravity flex flex-col items-center gap-8">
      <!-- Wheel -->
      <div id="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheel-canvas" width="960" height="960"></canvas>
        <!-- Center hub -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 bg-dark rounded-full border-4 border-white z-20 shadow-[0_0_18px_#fff] flex items-center justify-center">
          <div class="w-5 h-5 rounded-full bg-black border border-cyan-400 shadow-[0_0_8px_#00f3ff] animate-pulse"></div>
        </div>
      </div>

      <!-- Spin button -->
      <button id="btn-spin" class="px-10 py-4 rounded-full neon-btn text-xl font-bold w-60">
        <span data-i18n="btn_spin">LANCER LA ROUE</span>
      </button>
    </div>
  </section>

  <!-- ─── RIGHT PANEL ─── -->
  <aside class="right-panel w-full lg:w-[340px] flex flex-col gap-4 anti-gravity">

    <!-- Stats -->
    <div class="glass-panel p-5 flex flex-col gap-3">
      <span class="font-orbitron text-xs tracking-widest text-cyan-400" data-i18n="lbl_stats">STATISTIQUES</span>
      <div id="stats-list" class="flex flex-col gap-3 max-h-80 overflow-y-auto pr-1">
        <p class="text-gray-500 text-sm italic text-center py-3" data-i18n="stats_empty">Lance la roue pour voir les stats</p>
      </div>
    </div>

    <!-- Wheel title (mobile visible) -->
    <div class="glass-panel p-4 md:hidden">
      <label class="text-xs text-gray-400 font-orbitron block mb-2" data-i18n="lbl_title">TITRE DE LA ROUE</label>
      <input id="wheel-title-m" type="text" maxlength="40" value="Ma Roue"
        class="w-full rounded-lg px-3 py-2 text-sm font-orbitron">
    </div>

  </aside>
</main>

<!-- ═══ RESULT MODAL ═══ -->
<div id="result-modal">
  <div class="result-content flex flex-col items-center gap-4 px-6 anti-gravity">
    <div class="text-5xl">🎯</div>
    <h2 class="font-orbitron text-gray-300 text-xl tracking-widest" data-i18n="winner_title">RÉSULTAT</h2>
    <div id="winner-text" class="font-orbitron font-black text-center text-5xl md:text-7xl break-words max-w-xl neon-gold px-4">—</div>
    <div id="winner-stats" class="text-gray-400 text-sm font-orbitron"></div>
    <div class="flex gap-4 mt-4">
      <button id="btn-spin-again" class="neon-btn neon-btn-cyan px-6 py-3 rounded-full text-base">
        <i class="fas fa-redo mr-2"></i><span data-i18n="btn_again">REJOUER</span>
      </button>
      <button id="btn-close-modal" class="px-6 py-3 rounded-full border border-white/20 text-white hover:bg-white/10 font-orbitron text-base tracking-wider transition-colors">
        <span data-i18n="btn_close">CONTINUER</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   1. DATA: TRANSLATIONS + PRESETS
══════════════════════════════════════════════════════════════════ */
const TRANSLATIONS = {
  fr: {
    tab_options:'OPTIONS', tab_presets:'MODÈLES', tab_settings:'RÉGLAGES',
    weights_off:'POIDS OFF', weights_on:'POIDS ON',
    ph_add:'Nouvelle option…',
    presets_desc:'Remplacer la roue par un modèle prédéfini.',
    lbl_duration:'Durée du spin', dur_fast:'Rapide', dur_dramatic:'Dramatique',
    lbl_remove:'Supprimer le gagnant après spin',
    btn_share:'PARTAGER LA ROUE',
    btn_reset_stats:'RÉINITIALISER STATS',
    lbl_history:'HISTORIQUE', history_empty:'Aucun résultat pour l\'instant.',
    lbl_stats:'STATISTIQUES', stats_empty:'Lance la roue pour voir les stats.',
    lbl_title:'TITRE DE LA ROUE',
    btn_spin:'LANCER LA ROUE', winner_title:'RÉSULTAT !',
    btn_again:'REJOUER', btn_close:'CONTINUER',
    msg_min2:'Il faut au moins 2 options.',
    msg_copied:'Lien copié !',
    msg_cleared:'Roue vidée.',
    msg_stats_reset:'Statistiques réinitialisées.',
    msg_loaded:'Roue partagée chargée !',
    lbl_times:'fois',
    lbl_weight:'Poids',
    lbl_prob:'prob.',
    preset_yesno:'Oui / Non / Peut-être',
    preset_days:'Jours de la semaine',
    preset_nums:'Chiffres 1 à 10',
    preset_food:'Que manger ce soir ?',
    preset_weekend:'Que faire ce weekend ?',
    preset_names:'Tirage au sort de noms',
    preset_duo:'Décisions pour 2 personnes',
    preset_colors:'Couleurs',
    preset_planets:'Planètes du système solaire',
    preset_movies:'Genre de film',
  },
  en: {
    tab_options:'OPTIONS', tab_presets:'TEMPLATES', tab_settings:'SETTINGS',
    weights_off:'WEIGHTS OFF', weights_on:'WEIGHTS ON',
    ph_add:'New option…',

let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTick(speed = 1) {
  if (!state.soundEnabled) return;
  initAudio();
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(600 + speed * 200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.04);
  g.gain.setValueAtTime(0.25, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.04);
}
function playWin() {
  if (!state.soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.18, now + 0.1 + i * 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 2.5);
  });
}

/* ══════════════════════════════════════════════════════════════════
   5. WHEEL RENDERING
══════════════════════════════════════════════════════════════════ */
function drawWheel() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2, R = W / 2 - 12;
  ctx.clearRect(0, 0, W, H);

  const segs = state.segments;
  if (!segs.length) {
    ctx.fillStyle = 'rgba(0,243,255,0.08)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = 'bold 36px Orbitron,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('SPINLUX', cx, cy);
    return;
  }

  // Build weighted slots
  const totalWeight = segs.reduce((s, seg) => s + (seg.weight || 1), 0);
  let startAngle = -Math.PI / 2;

  segs.forEach((seg, idx) => {
    const w = seg.weight || 1;
    const sliceAngle = (w / totalWeight) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;
    const midAngle = startAngle + sliceAngle / 2;

    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.closePath();

    const r = parseInt(seg.color.slice(1,3),16);
    const g = parseInt(seg.color.slice(3,5),16);
    const b = parseInt(seg.color.slice(5,7),16);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    grad.addColorStop(0,   `rgba(${r},${g},${b},0.15)`);
    grad.addColorStop(0.75, seg.color);
    grad.addColorStop(1,   `rgba(${r},${g},${b},0.7)`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#05050f'; ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(midAngle);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // Dynamic font size based on number of segments
    const baseFontSize = Math.max(22, Math.min(44, 44 - segs.length * 1.4));
    ctx.font = `bold ${baseFontSize}px Orbitron,sans-serif`;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 8;

    let txt = seg.text;
    const maxLen = segs.length > 12 ? 9 : segs.length > 6 ? 13 : 18;
    if (txt.length > maxLen) txt = txt.slice(0, maxLen - 2) + '…';
    ctx.fillText(txt, R - 30, 0);
    ctx.restore();

    startAngle = endAngle;
  });

  // Center cap
  ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2);
  ctx.fillStyle = '#030308'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.stroke();
}

/* ══════════════════════════════════════════════════════════════════
   6. SPIN PHYSICS
══════════════════════════════════════════════════════════════════ */
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

function spinWheel() {
  if (state.isSpinning) return;
  if (state.segments.length < 2) { showToast(t('msg_min2')); return; }

  initAudio();
  state.isSpinning = true;
  spinBtn.disabled = true;
  spinBtn.style.opacity = '0.5';
  wheelWrap.parentElement.classList.remove('anti-gravity');

  const duration = state.spinDuration * 1000;
  const extraSpins = 8 + Math.random() * 6;

  // Pre-determine winner based on weights
  const winner = pickWeightedWinner();
  const winnerIndex = state.segments.indexOf(winner);

  // Calculate how much the wheel must rotate so winner ends under pointer
  const totalWeight = state.segments.reduce((s,seg) => s + (seg.weight||1), 0);
  let angleToWinner = 0;
  for (let i = 0; i < winnerIndex; i++) {
    angleToWinner += ((state.segments[i].weight||1) / totalWeight) * 360;
  }
  // Center of winner slice
  const winnerWidth = ((winner.weight||1) / totalWeight) * 360;
  angleToWinner += winnerWidth / 2;

  // The pointer is at top (0 deg in our draw = -90° in math, but we handle via -PI/2 offset).
  // We want: (currentRotation + targetSpin) % 360 such that angleToWinner lands at top.
  const normalized = state.currentRotation % 360;
  const targetRemainder = (360 - angleToWinner) % 360;
  let delta = targetRemainder - normalized;
  if (delta < 0) delta += 360;
  const targetRotation = state.currentRotation + (extraSpins * 360) + delta;

  const startRotation = state.currentRotation;
  let startTime = null;
  let lastIndex = -1;

  function animate(ts) {
    if (!startTime) startTime = ts;
    const progress = Math.min((ts - startTime) / duration, 1);
    const eased = easeOutQuint(progress);
    state.currentRotation = startRotation + eased * (targetRotation - startRotation);
    canvas.style.transform = `rotate(${state.currentRotation}deg)`;

    // Tick detection
    const speed = 1 - progress;
    const segs = state.segments;
    const tw = segs.reduce((s,g)=>s+(g.weight||1),0);
    let acc = 0, idx = -1;
    const rot = ((state.currentRotation % 360) + 360) % 360;
    for (let i = 0; i < segs.length; i++) {
      acc += (segs[i].weight||1) / tw * 360;
      if (rot < acc) { idx = i; break; }
    }
    if (idx !== lastIndex && lastIndex !== -1) playTick(speed);
    lastIndex = idx;

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      finishSpin(winner);
    }
  }
  requestAnimationFrame(animate);
}

function pickWeightedWinner() {
  const segs = state.segments;
  const total = segs.reduce((s,g) => s + (g.weight||1), 0);
  let r = Math.random() * total;
  for (const seg of segs) { r -= (seg.weight||1); if (r <= 0) return seg; }
  return segs[segs.length - 1];
}

function finishSpin(winner) {
  state.isSpinning = false;
  spinBtn.disabled = false;
  spinBtn.style.opacity = '1';
  wheelWrap.parentElement.classList.add('anti-gravity');

  // Update stats
  const key = winner.text;
  state.stats[key] = (state.stats[key] || 0) + 1;

  // Update history
  state.history.unshift({ text: winner.text, color: winner.color, time: new Date() });
  if (state.history.length > 20) state.history.pop();

  // Remove winner if enabled
  if (state.removeWinner && state.segments.length > 1) {
    state.segments = state.segments.filter(s => s !== winner);
    drawWheel();
    renderSegList();
  }

  saveData();
  renderHistory();
  renderStats();
  showWinnerModal(winner);
}

function renderSegList() {
  segList.innerHTML = '';
  state.segments.forEach((seg, idx) => {
    const div = document.createElement('div');
    div.className = 'seg-item';
    div.draggable = true;
    div.dataset.index = idx;

    const dot = `<div class="w-5 h-5 rounded-full flex-shrink-0 cursor-pointer" style="background:${seg.color};box-shadow:0 0 8px ${seg.color}" title="Changer couleur" onclick="changeColor(${idx})"></div>`;

    const textSpan = `<span class="flex-grow text-sm font-semibold truncate cursor-pointer" ondblclick="editSegText(this,${idx})" title="Double-clic pour éditer">${escHtml(seg.text)}</span>`;

    const weightSpan = state.weightsEnabled
      ? `<input type="number" min="1" max="100" value="${seg.weight||1}" class="w-12 text-center text-xs rounded px-1 py-0.5 font-orbitron" style="background:rgba(176,38,255,.15);border:1px solid rgba(176,38,255,.4);color:rgba(176,38,255,.9)" onchange="updateWeight(${idx},this.value)" title="${t('lbl_weight')}">`
      : '';

    const del = `<button class="text-gray-600 hover:text-red-400 transition-colors text-xs flex-shrink-0 ml-1" onclick="removeSeg(${idx})"><i class="fas fa-times"></i></button>`;

    div.innerHTML = `
      <span class="text-gray-600 text-xs cursor-grab mr-1">⠿</span>
      ${dot}
      ${textSpan}
      ${weightSpan}
      ${del}`;

    div.addEventListener('dragstart', dndStart);
    div.addEventListener('dragover', dndOver);
    div.addEventListener('drop', dndDrop);
    div.addEventListener('dragend', dndEnd);
    segList.appendChild(div);
  });

  document.getElementById('seg-count').textContent = `${state.segments.length}/50`;
}

function renderPresets() {
  const list = document.getElementById('presets-list');
  list.innerHTML = '';
  Object.keys(PRESETS).forEach(key => {
    const preset = PRESETS[key];
    const label = t(preset.labelKey);
    const card = document.createElement('div');
    card.className = 'preset-card';
    const isActive = state.currentPreset === key;
    card.innerHTML = `
      <span class="text-sm font-semibold ${isActive ? 'text-cyan-400' : 'text-gray-200'}">${escHtml(label)}</span>
      <i class="fas fa-arrow-right text-xs ${isActive ? 'text-cyan-400' : 'text-gray-600'}"></i>`;
    card.onclick = () => loadPreset(key);
    list.appendChild(card);
  });
}

function loadPreset(key) {
  const preset = PRESETS[key];
  const raw = preset.data[state.lang] || preset.data.fr;
  state.segments = raw.map((item, i) => {
    if (typeof item === 'string') return { text: item, color: NEON[i % NEON.length], weight: 1 };
    return { text: item.text, color: item.color || NEON[i % NEON.length], weight: item.weight || 1 };
  });
  state.currentPreset = key;
  state.stats = {};
  updateAll();
  renderPresets();
}

function renderHistory() {
  const ul = document.getElementById('history-list');
  ul.innerHTML = '';
  if (!state.history.length) {
    ul.innerHTML = `<li class="text-gray-500 text-sm italic text-center py-3">${t('history_empty')}</li>`;
    return;
  }
  state.history.slice(0, 10).forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'flex items-center gap-2 text-sm py-1 border-b border-white/04';
    li.innerHTML = `
      <span class="w-5 h-5 rounded-full flex-shrink-0 inline-block" style="background:${item.color};box-shadow:0 0 5px ${item.color}"></span>
      <span class="truncate flex-grow font-semibold">${escHtml(item.text)}</span>
      <span class="text-gray-600 text-xs flex-shrink-0">#${i+1}</span>`;
    ul.appendChild(li);
  });
}

function renderStats() {
  const list = document.getElementById('stats-list');
  const keys = Object.keys(state.stats);
  if (!keys.length) {
    list.innerHTML = `<p class="text-gray-500 text-sm italic text-center py-3">${t('stats_empty')}</p>`;
    return;
  }
  const total = Object.values(state.stats).reduce((a,b)=>a+b,0);
  list.innerHTML = '';
  // Sort by count desc
  keys.sort((a,b) => state.stats[b] - state.stats[a]).forEach(key => {
    const count = state.stats[key];
    const pct = Math.round(count / total * 100);
    const seg = state.segments.find(s => s.text === key);
    const color = seg ? seg.color : '#00f3ff';
    const div = document.createElement('div');
    div.className = 'flex flex-col gap-1';
    div.innerHTML = `
      <div class="flex justify-between items-center text-xs">
        <span class="truncate font-semibold text-gray-200 max-w-[65%]">${escHtml(key)}</span>
        <span class="font-orbitron text-xs" style="color:${color}">${count} ${t('lbl_times')} · ${pct}%</span>
      </div>
      <div class="h-1.5 rounded-full bg-white/05 overflow-hidden">
        <div class="stat-bar-fill rounded-full" style="width:${pct}%;--c1:${color};--c2:${color}aa"></div>
      </div>`;
    list.appendChild(div);
  });
}

/* ══════════════════════════════════════════════════════════════════
   8. SEGMENT CRUD
══════════════════════════════════════════════════════════════════ */
function addSeg() {
  if (state.segments.length >= 50) return;
  const txtEl = document.getElementById('add-text');
  const colEl = document.getElementById('add-color');
  const wEl   = document.getElementById('add-weight');
  const text  = txtEl.value.trim();
  if (!text) return;
  state.segments.push({ text, color: colEl.value, weight: parseInt(wEl?.value)||1 });
  txtEl.value = '';
  colEl.value = NEON[state.segments.length % NEON.length];
  updateAll();
}
function removeSeg(idx) {
  state.segments.splice(idx, 1);
  updateAll();
}
function updateWeight(idx, val) {
  state.segments[idx].weight = Math.max(1, Math.min(100, parseInt(val)||1));
  drawWheel();
  saveData();
}
function changeColor(idx) {
  const input = document.createElement('input');
  input.type = 'color';
  input.value = state.segments[idx].color;
  input.addEventListener('input', e => {
    state.segments[idx].color = e.target.value;
    drawWheel(); renderSegList(); saveData();
  });
  input.click();
}
function editSegText(span, idx) {
  const old = state.segments[idx].text;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = old;
  input.className = 'flex-grow text-sm font-semibold bg-transparent border-b border-cyan-400/50 outline-none text-white w-full';
  span.replaceWith(input);
  input.focus();
  input.select();
  const commit = () => {
    const newVal = input.value.trim() || old;
    state.segments[idx].text = newVal;
    // Update stats key
    if (old !== newVal && state.stats[old] !== undefined) {
      state.stats[newVal] = (state.stats[newVal]||0) + state.stats[old];
      delete state.stats[old];
    }
    updateAll();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key==='Enter') input.blur(); if (e.key==='Escape') { input.value=old; input.blur(); } });
}

/* ══════════════════════════════════════════════════════════════════
   9. DND
══════════════════════════════════════════════════════════════════ */
let dragSrc = null;
function dndStart(e) { dragSrc=this; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',this.dataset.index); this.classList.add('dragging'); }
function dndOver(e)  { e.preventDefault(); e.dataTransfer.dropEffect='move'; }
function dndDrop(e)  {
  e.stopPropagation();
  if (dragSrc!==this) {
    const from=parseInt(e.dataTransfer.getData('text/plain')), to=parseInt(this.dataset.index);
    const item=state.segments.splice(from,1)[0];
    state.segments.splice(to,0,item);
    updateAll();
  }
}
function dndEnd()    { this.classList.remove('dragging'); }

/* ══════════════════════════════════════════════════════════════════
   10. WINNER MODAL
══════════════════════════════════════════════════════════════════ */
function showWinnerModal(winner) {
  playWin();
  const el = document.getElementById('winner-text');
  el.textContent = winner.text;
  el.style.textShadow = `0 0 10px ${winner.color},0 0 22px ${winner.color},0 0 46px ${winner.color}`;
  const count = state.stats[winner.text]||0;
  document.getElementById('winner-stats').textContent = `${count} ${t('lbl_times')} au total`;
  modal.classList.add('active');
  fireConfetti(winner.color);
}
function closeModal() {
  modal.classList.remove('active');
  stopConfetti();
}

/* ══════════════════════════════════════════════════════════════════
   11. I18N
══════════════════════════════════════════════════════════════════ */
function t(key) { return (TRANSLATIONS[state.lang]||TRANSLATIONS.fr)[key] || key; }

function changeLanguage(lang) {
  if (!TRANSLATIONS[lang]) return;
  state.lang = lang;

  // Update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (el.tagName==='INPUT' && el.type==='text') el.placeholder = val;
    else el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-ph'));
  });

  // Update flags
  document.querySelectorAll('.lang-flag').forEach(f => f.classList.toggle('active', f.dataset.lang===lang));

  // Reload preset if active
  if (state.currentPreset) loadPreset(state.currentPreset);

  // Update weights button text
  document.getElementById('btn-weights').textContent = state.weightsEnabled ? t('weights_on') : t('weights_off');

  renderPresets();
  renderHistory();
  renderStats();
  saveData();
}

/* ══════════════════════════════════════════════════════════════════
   12. PERSISTENCE
══════════════════════════════════════════════════════════════════ */
function saveData() {
  try {
    localStorage.setItem('spinlux_v2', JSON.stringify({
      segments: state.segments,
      history:  state.history,
      stats:    state.stats,
      lang:     state.lang,
      spinDuration: state.spinDuration,
      weightsEnabled: state.weightsEnabled,
      removeWinner: state.removeWinner,
      title: document.getElementById('wheel-title').value,
    }));
  } catch(e) {}
}
function loadData() {
  // URL hash share
  if (location.hash.length > 1) {
    try {
      const decoded = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
      if (Array.isArray(decoded) && decoded.length) {
        state.segments = decoded;
        location.hash = '';
        updateAll();
        showToast(t('msg_loaded'));
        return;
      }
    } catch(e) {}
  }
  try {
    const saved = JSON.parse(localStorage.getItem('spinlux_v2'));
    if (saved) {
      state.segments     = saved.segments||[];
      state.history      = saved.history||[];
      state.stats        = saved.stats||{};
      state.spinDuration = saved.spinDuration||6;
      state.weightsEnabled = saved.weightsEnabled||false;
      state.removeWinner = saved.removeWinner||false;
      if (saved.lang) state.lang = saved.lang;
      if (saved.title) {
        document.getElementById('wheel-title').value = saved.title;
        const m = document.getElementById('wheel-title-m');
        if (m) m.value = saved.title;
      }
    }
  } catch(e) {}

  if (!state.segments.length) loadPreset('yesno');
  else updateAll();
  renderHistory();
  renderStats();

  // Restore duration slider
  const slider = document.getElementById('spin-duration');
  slider.value = state.spinDuration;
  document.getElementById('spin-duration-val').textContent = state.spinDuration+'s';

  // Restore weights
  if (state.weightsEnabled) {
    document.getElementById('add-weight-wrap').classList.remove('hidden');
    document.getElementById('btn-weights').textContent = t('weights_on');
  }

  // Restore remove winner toggle
  updateRemoveWinnerBtn();
}

function shareWheel() {
  try {
    const json = JSON.stringify(state.segments);
    const b64  = btoa(unescape(encodeURIComponent(json)));
    const url  = location.origin + location.pathname + '#' + b64;
    navigator.clipboard.writeText(url).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
    showToast(t('msg_copied'));
  } catch(e) {}
}

/* ══════════════════════════════════════════════════════════════════
   13. HELPERS
══════════════════════════════════════════════════════════════════ */
function updateAll() {
  drawWheel();
  renderSegList();
  renderStats();
  saveData();
}

function showToast(msg, duration=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateRemoveWinnerBtn() {
  const btn = document.getElementById('btn-remove-winner');
  const thumb = btn.querySelector('span');
  if (state.removeWinner) {
    btn.style.background = 'rgba(0,243,255,.25)';
    btn.style.borderColor = 'rgba(0,243,255,.5)';
    thumb.style.transform = 'translateX(20px)';
  } else {
    btn.style.background = 'rgba(255,255,255,.08)';
    btn.style.borderColor = 'rgba(255,255,255,.2)';
    thumb.style.transform = 'translateX(0)';
  }
}

/* ══════════════════════════════════════════════════════════════════
   14. PARTICLES BACKGROUND
══════════════════════════════════════════════════════════════════ */
const bgCvs = document.getElementById('bg-canvas');
const bgCtx = bgCvs.getContext('2d');
let particles = [];

function initParticles() {
  bgCvs.width  = window.innerWidth;
  bgCvs.height = window.innerHeight;
  particles = Array.from({length:55}, () => mkParticle());
  animParticles();
}
function mkParticle() {
  return {
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.8 + 0.4,
    vy: -(Math.random() * 0.45 + 0.1),
    vx: (Math.random() - 0.5) * 0.35,
    a:  Math.random() * 0.45 + 0.08,
    c:  NEON[Math.floor(Math.random()*NEON.length)]
  };
}
function animParticles() {
  bgCtx.clearRect(0,0,bgCvs.width,bgCvs.height);
  particles.forEach(p => {
    p.y += p.vy; p.x += p.vx;
    if (p.y < -5) { p.y = bgCvs.height+5; p.x = Math.random()*bgCvs.width; }
    bgCtx.beginPath(); bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle = p.c; bgCtx.globalAlpha = p.a;
    bgCtx.shadowBlur = 4; bgCtx.shadowColor = p.c;
    bgCtx.fill();
  });
  bgCtx.globalAlpha=1; bgCtx.shadowBlur=0;
  requestAnimationFrame(animParticles);
}
window.addEventListener('resize', () => {
  bgCvs.width  = window.innerWidth;
  bgCvs.height = window.innerHeight;
});

/* ══════════════════════════════════════════════════════════════════
   15. CONFETTI
══════════════════════════════════════════════════════════════════ */
const cCvs = document.getElementById('conf-canvas');
const cCtx = cCvs.getContext('2d');
let confettiParts = [], confId = null;

function fireConfetti(color) {
  cCvs.width = window.innerWidth; cCvs.height = window.innerHeight;
  cCvs.style.display='block';
  confettiParts = [];
  for (let i=0; i<180; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 4 + Math.random()*16;
    confettiParts.push({
      x: window.innerWidth/2, y: window.innerHeight/2,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 4,
      size: Math.random()*9+4,
      rot: Math.random()*360, rotV: (Math.random()-0.5)*12,
      color: Math.random()>.4 ? color : '#fff',
      life: 1
    });
  }
  if (confId) cancelAnimationFrame(confId);
  animConfetti();
}
function animConfetti() {
  cCtx.clearRect(0,0,cCvs.width,cCvs.height);
  let alive = false;
  confettiParts.forEach(c => {
    if (c.life > 0) {
      alive = true;
      c.x+=c.vx; c.y+=c.vy; c.vy+=0.25; c.vx*=0.97;
      c.rot+=c.rotV; c.life-=0.006;
      cCtx.save();
      cCtx.translate(c.x,c.y); cCtx.rotate(c.rot*Math.PI/180);
      cCtx.globalAlpha=Math.max(0,c.life);
      cCtx.fillStyle=c.color;
      cCtx.shadowBlur=10; cCtx.shadowColor=c.color;
      cCtx.fillRect(-c.size/2,-c.size/2,c.size,c.size);
      cCtx.restore();
    }
  });
  if (alive) confId = requestAnimationFrame(animConfetti);
  else cCvs.style.display='none';
}
function stopConfetti() {
  confettiParts=[];
  cCtx.clearRect(0,0,cCvs.width,cCvs.height);
  cCvs.style.display='none';
  if (confId) cancelAnimationFrame(confId);
}

/* ══════════════════════════════════════════════════════════════════
   16. INIT & EVENT LISTENERS
══════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {

  // Spin
  spinBtn.addEventListener('click', spinWheel);
  wheelWrap.addEventListener('click', spinWheel);

  // Add form
  document.getElementById('add-form').addEventListener('submit', e => { e.preventDefault(); addSeg(); });

  // Clear
  document.getElementById('btn-clear').addEventListener('click', () => {
    state.segments=[]; state.currentPreset=null; updateAll();
    showToast(t('msg_cleared'));
  });

  // Shuffle
  document.getElementById('btn-shuffle').addEventListener('click', () => {
    state.segments.sort(()=>Math.random()-.5); updateAll();
  });

  // Weights toggle
  document.getElementById('btn-weights').addEventListener('click', () => {
    state.weightsEnabled = !state.weightsEnabled;
    document.getElementById('btn-weights').textContent = state.weightsEnabled ? t('weights_on') : t('weights_off');
    document.getElementById('add-weight-wrap').classList.toggle('hidden', !state.weightsEnabled);
    renderSegList();
    saveData();
  });

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.remove('hidden');
      if (btn.dataset.tab === 'presets') renderPresets();
    });
  });

  // Language
  document.querySelectorAll('.lang-flag').forEach(f => {
    f.addEventListener('click', e => changeLanguage(e.currentTarget.dataset.lang));
  });

  // Duration slider
  const durSlider = document.getElementById('spin-duration');
  durSlider.addEventListener('input', e => {
    state.spinDuration = parseInt(e.target.value);
    document.getElementById('spin-duration-val').textContent = state.spinDuration+'s';
    saveData();
  });

  // Remove winner toggle
  document.getElementById('btn-remove-winner').addEventListener('click', () => {
    state.removeWinner = !state.removeWinner;
    updateRemoveWinnerBtn();
    saveData();
  });

  // Share
  document.getElementById('btn-share').addEventListener('click', shareWheel);

  // Reset stats
  document.getElementById('btn-reset-stats').addEventListener('click', () => {
    state.stats={}; renderStats(); saveData();
    showToast(t('msg_stats_reset'));
  });

  // Clear history
  document.getElementById('btn-clear-history').addEventListener('click', () => {
    state.history=[]; renderHistory(); saveData();
  });

  // Audio
  document.getElementById('btn-audio').addEventListener('click', e => {
    state.soundEnabled = !state.soundEnabled;
    e.currentTarget.innerHTML = state.soundEnabled
      ? '<i class="fas fa-volume-up"></i>'
      : '<i class="fas fa-volume-mute" style="color:#666"></i>';
  });

  // Fullscreen
  document.getElementById('btn-fs').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen && document.exitFullscreen();
  });

  // Modal buttons
  document.getElementById('btn-close-modal').addEventListener('click', closeModal);
  document.getElementById('btn-spin-again').addEventListener('click', () => { closeModal(); setTimeout(spinWheel, 400); });

  // Sync wheel title inputs
  document.getElementById('wheel-title').addEventListener('input', e => {
    const m = document.getElementById('wheel-title-m');
    if (m) m.value = e.target.value;
    saveData();
  });
  const wheelTitleM = document.getElementById('wheel-title-m');
  if (wheelTitleM) wheelTitleM.addEventListener('input', e => {
    document.getElementById('wheel-title').value = e.target.value;
    saveData();
  });

  // Close modal on backdrop
  modal.addEventListener('click', e => { if (e.target===modal) closeModal(); });

  // Init color picker
  document.getElementById('add-color').value = NEON[0];

  // Load & start
  loadData();
  changeLanguage(state.lang);
  initParticles();
});
</script>
